<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style><title>GreenRoute Crew &amp; Owner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column for the crew; the owner screen widens to two columns on desktop. Palette carried over from RealEstate-AI. */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --sunken: #eaeeeb; --ink: #16201c; --muted: #5a6962; --line: #d9e0dc;
  --accent: #2c6a55; --accent-ink: #ffffff; --accent-soft: #dcebe4;
  --brass: #9a7316; --brass-soft: #f3e8cc; --ok: #2d7a4c; --ok-soft: #dcefe2;
  --warn: #a8670f; --warn-soft: #f7e7cc; --bad: #b0402c; --bad-soft: #f6dfd9;
  --bar: #16201c; --bar-ink: #eef3f0;
  --map-land: #e7ece4; --map-park: #cfe0c8; --map-water: #cfe0ea; --map-road: #ffffff; --map-main: #f6e8c4;
  --c1: #2f6fb0; --c2: #2c6a55; --c3: #b0402c; --c4: #8a55a8;
  --shade: rgba(16, 24, 20, 0.4);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --sunken: #0d1311; --ink: #e5ece8; --muted: #9aaba3; --line: #2a3632;
    --accent: #6cc2a3; --accent-ink: #0c1512; --accent-soft: #1d3a30; --brass: #d9b45a; --brass-soft: #3a3019;
    --ok: #6fcf93; --ok-soft: #173326; --warn: #e6ad55; --warn-soft: #3b2c14; --bad: #ee8a75; --bad-soft: #3d1f19;
    --bar: #0b100e; --bar-ink: #dfe7e2;
    --map-land: #1a2420; --map-park: #20332a; --map-water: #1b2a33; --map-road: #2c3a35; --map-main: #4a4230;
    --c1: #7fb2e6; --c2: #6cc2a3; --c3: #ee8a75; --c4: #c79be0;
    --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --sunken: #0d1311; --ink: #e5ece8; --muted: #9aaba3; --line: #2a3632;
  --accent: #6cc2a3; --accent-ink: #0c1512; --accent-soft: #1d3a30; --brass: #d9b45a; --brass-soft: #3a3019;
  --ok: #6fcf93; --ok-soft: #173326; --warn: #e6ad55; --warn-soft: #3b2c14; --bad: #ee8a75; --bad-soft: #3d1f19;
  --bar: #0b100e; --bar-ink: #dfe7e2;
  --map-land: #1a2420; --map-park: #20332a; --map-water: #1b2a33; --map-road: #2c3a35; --map-main: #4a4230;
  --c1: #7fb2e6; --c2: #6cc2a3; --c3: #ee8a75; --c4: #c79be0;
  --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* demo bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bar); }
.demo-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); color: var(--bar-ink); padding-block: 8px; }
.demo-bar .in { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
.demo-bar .lbl { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--bar-ink) 35%, transparent); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-ink); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.demo-bar .sp { flex: 1; }
@media (max-width: 480px) { .demo-bar .lbl { display: none; } .demo-bar .ghost { padding: 6px 10px; } }
.demo-bar .ghost { background: transparent; border: 1px solid color-mix(in srgb, var(--bar-ink) 35%, transparent); color: var(--bar-ink); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; min-height: 36px; }

/* banners */
.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
.banner.rain { background: var(--c1); color: #fff; }
:root[data-theme="dark"] .banner.rain { color: #0c1512; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner.rain { color: #0c1512; } }
.banner b { display: block; }
.banner button { margin-left: auto; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; white-space: nowrap; }

/* ---------- crew screen ---------- */
[hidden] { display: none !important; }
#crew { max-width: 480px; margin: 0 auto; padding-block: 12px 96px; display: flex; flex-direction: column; gap: 14px; }
.crew-head { display: flex; align-items: center; gap: 12px; }
.crew-head .who { flex: 1; min-width: 0; }
.crew-head .who h1 { font-size: 1.45rem; }
.crew-head .who span { color: var(--muted); font-size: 0.9rem; }
.clock { border: 0; border-radius: 999px; padding: 10px 16px; min-height: 48px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.clock.out { background: var(--accent); color: var(--accent-ink); }
.clock.in { background: var(--ok-soft); color: var(--ok); }
.clock .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.clock.in .dot { animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress i.d { background: var(--accent); }
.progress i.b { background: var(--warn); }
.progress i.m { background: var(--c1); opacity: 0.5; }
.progress-txt { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

.job { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.job.current { border: 2px solid var(--accent); box-shadow: 0 6px 24px -12px var(--shade); }
.job-top { padding: 16px 16px 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.stopno { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--accent); color: var(--accent-ink); font-size: 1.1rem; }
.job-top h2 { font-size: 1.35rem; }
.job-top .addr { font-size: 1rem; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip.freq { background: var(--accent-soft); color: var(--accent); }
.chip.season { background: var(--brass-soft); color: var(--brass); }
.chip.app { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.blue { background: color-mix(in srgb, var(--c1) 18%, transparent); color: var(--c1); }
.notes { margin: 0 16px 12px; border-radius: 10px; background: var(--brass-soft); padding: 10px 12px; display: grid; gap: 6px; }
.note { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font-size: 0.97rem; }
.note svg { width: 22px; height: 22px; color: var(--brass); }
.note b { font-weight: 600; }
.sec-label { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 16px 6px; }
.checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 14px; }
.check { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 52px; padding: 8px 12px; text-align: left; font-weight: 600; }
.check .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.check[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check:disabled { opacity: 0.55; cursor: default; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 14px; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; border: 2px dashed var(--line); background: var(--sunken); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 0.85rem; overflow: hidden; padding: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .tag { position: absolute; left: 6px; top: 6px; background: var(--bar); color: var(--bar-ink); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }

.ph svg.cam { width: 28px; height: 28px; display: block; margin: 0 auto 4px; }
.main-act { margin: 0 16px; }
.nextbox { margin: 0 16px 14px; display: grid; gap: 10px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 600; font-size: 0.92rem; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.notein { display: grid; grid-template-columns: 1fr 52px; gap: 8px; }
.notein input { min-width: 0; }
.notein button { padding: 0; display: grid; place-items: center; }
.notein button svg { width: 22px; height: 22px; }
.crewpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
@media (min-width: 560px) { .crewpick { grid-template-columns: repeat(4, 1fr); } }
.crewpick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 52px; padding: 6px 10px; text-align: left; font-weight: 600; font-size: 0.9rem; display: grid; grid-template-columns: 12px 1fr; column-gap: 8px; align-items: center; }
.crewpick i { width: 12px; height: 12px; border-radius: 50%; background: var(--cc); grid-row: span 2; }
.crewpick small { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.crewpick small.o { color: var(--bad); font-weight: 600; }

.ntile svg { width: 28px; height: 28px; color: var(--brass); }
.ntile[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); box-shadow: inset 0 0 0 1px var(--brass); }
.npanel { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; background: var(--brass-soft); border-radius: 12px; padding: 10px; }
.nic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; color: var(--brass); }
.nic svg { width: 24px; height: 24px; }
.lic svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--brass); }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.nchip { display: inline-flex; align-items: center; gap: 5px; background: var(--brass-soft); color: var(--brass); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 0.8rem; font-weight: 600; }
.nchip svg { width: 16px; height: 16px; }
.gpsline { display: flex; gap: 6px; justify-content: center; align-items: center; font-size: 0.88rem; font-weight: 600; color: var(--c1); margin: 6px 16px 0; }
.gpsline svg { width: 16px; height: 16px; }
.gpsline.ok { color: var(--ok); }
.gpschip { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 600; }
.gpschip svg { width: 14px; height: 14px; }
.gpschip.off { color: var(--bad); }
.locoff { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.locoff .nic { width: 64px; height: 64px; border-radius: 16px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; }
.locoff .nic svg { width: 32px; height: 32px; }
.locoff p { margin: 0; max-width: 36ch; }
.setrow { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.setrow input, .setrow select { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 10px; font: inherit; width: 100%; min-width: 0; }
.note-sm { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; }
.subtabs { display: flex; gap: 4px; overflow-x: auto; margin-top: -6px; scrollbar-width: none; }
.subtabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); min-height: 40px; white-space: nowrap; }
.subtabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.headline { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.headline > div:first-child { min-width: 0; }
.headline b { font-family: var(--font-display); font-size: 1.4rem; display: block; line-height: 1.2; }
.headline span { color: var(--muted); }
.hl-need { text-align: center; background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 8px 14px; flex: none; }
.hl-need b { font-size: 1.8rem; }
.hl-need span { color: inherit; font-size: 0.8rem; font-weight: 600; }
.hl-need.ok { background: var(--ok-soft); color: var(--ok); }
.fchips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px; scrollbar-width: none; }
.fchips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 0.85rem; white-space: nowrap; min-height: 38px; }
.fchips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchips em { font-style: normal; margin-left: 6px; opacity: 0.7; }
.linkb { border: 0; background: none; padding: 0; font-weight: 700; font-size: 1rem; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; display: block; }
.proplink { display: inline-flex; gap: 6px; align-items: center; border: 0; background: var(--sunken); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; min-height: 36px; }
.proplink svg { width: 16px; height: 16px; }
.hist { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.hist .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 8px; overflow: hidden; }
.hist img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.hist b { display: block; }
.hist span { font-size: 0.85rem; color: var(--muted); display: block; }
.note.ed { grid-template-columns: 26px 1fr 36px; }
.nx { border: 0; background: var(--surface); border-radius: 8px; width: 32px; height: 32px; font-size: 1.2rem; line-height: 1; color: var(--bad); }
.nextsum { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; }
.nextsum svg { width: 22px; height: 22px; color: var(--ok); }
.nextsum b { display: block; }
.nextsum span { font-size: 0.85rem; color: var(--muted); }
.nextbox.compact { border-style: solid; background: var(--ok-soft); border-color: transparent; }
.shift-hero h2 { font-size: 1.6rem; }
.shift-hero p { margin: 4px 0 0; color: var(--muted); font-size: 1.05rem; }
.shiftlist .opt { min-height: 60px; font-size: 1.08rem; }
.precount { text-align: center; font-weight: 600; margin: 12px 0; font-size: 1.05rem; }
.gpsready { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 12px; font-weight: 600; }
.gpsready svg { width: 20px; height: 20px; }
.gpsready.off { background: var(--bad-soft); color: var(--bad); }
.bigopt { min-height: 76px; font-size: 1.15rem; }
.bigopt svg { width: 32px; height: 32px; flex: none; color: var(--accent); }
.bigopt small { font-size: 0.9rem; }
.bigopt.danger { color: var(--bad); }
.bigopt.danger svg { color: var(--bad); }
.pausecard { text-align: center; display: grid; gap: 14px; justify-items: center; padding-block: 28px; }
.pausecard .nic { width: 72px; height: 72px; border-radius: 18px; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; }
.pausecard .nic svg { width: 40px; height: 40px; }
.pausecard h2 { font-size: 1.6rem; }
.pausecard p { margin: 0; font-size: 1.02rem; }
.ptime { font-family: var(--font-display); font-size: 3.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.cocard { display: grid; gap: 14px; }
.cocard h2 { font-size: 1.6rem; }
.sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sumgrid div { background: var(--sunken); border-radius: 12px; padding: 12px; }
.sumgrid span { display: block; color: var(--muted); font-size: 0.95rem; }
.sumgrid b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.big.ghostbig { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.clock.pause { background: var(--brass-soft); color: var(--brass); }
.clock.idle { background: var(--sunken); color: var(--muted); }
.clock svg { width: 18px; height: 18px; }
.netchip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 700; font-size: 0.95rem; }
.netchip svg { width: 20px; height: 20px; }
.netchip.off { background: var(--warn-soft); color: var(--warn); }
.netchip.sync { background: color-mix(in srgb, var(--c1) 18%, transparent); color: var(--c1); }
.netchip.sync svg { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner.offline { background: var(--warn-soft); color: var(--ink); }
.banner.offline svg { color: var(--warn); flex: none; }
.obrow { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 1rem; }
.obrow:first-of-type { border-top: 0; }
.obrow svg { width: 24px; height: 24px; color: var(--muted); }
.obrow .tm { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.obbar { height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.obbar span { display: block; height: 100%; background: var(--c1); transition: width 0.3s; }
.login { display: grid; gap: 14px; max-width: 420px; margin: 0 auto; width: 100%; padding-top: 8px; }
.login h1 { font-size: 2rem; }

const UNIT_M = 25, STEP = 22, SIM_S = 60;   // 1 map unit = 25 m; one fix ≈ 550 m of driving = 1 min of demo time (≈33 km/h in town)

const pt = (a) => (Array.isArray(a) ? { x: a[0], y: a[1] } : { x: a.x, y: a.y });
const legWay = (a, b) => [{ x: b.x, y: a.y }, { x: b.x, y: b.y }];   // drive along one street, then the cross street
function sample(a, way) {
  const out = []; let cur = { x: a.x, y: a.y };
  for (const w of way) {
    let d = Math.hypot(w.x - cur.x, w.y - cur.y);
    while (d > STEP) { cur = { x: cur.x + (w.x - cur.x) * STEP / d, y: cur.y + (w.y - cur.y) * STEP / d }; out.push(cur); d -= STEP; }
    if (d > 0.5) { cur = { x: w.x, y: w.y }; out.push(cur); }
  }
  return out;
}

  const step = Math.hypot(p.x - d.pos.x, p.y - d.pos.y);
  d.km += step * UNIT_M / 1000; d.driveS += SIM_S;
  d.pos = { x: p.x, y: p.y };

  d.lastFix = Date.now();
}

function mapSVG({ crewOnly }) {

  let g = `<rect width="${W}" height="${H}" fill="var(--map-land)"/>`;

  g += `<rect x="40" y="60" width="150" height="110" rx="14" fill="var(--map-park)"/><rect x="600" y="430" width="170" height="120" rx="14" fill="var(--map-park)"/>`;
  for (let x = 80; x < W; x += 110) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--map-road)" stroke-width="7"/>`;
  for (let y = 70; y < H - 60; y += 95) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--map-road)" stroke-width="7"/>`;
  g += `<path d="M0 520 L 1000 180" stroke="var(--map-main)" stroke-width="14"/>`;
  g += `<text x="610" y="500" font-size="20" fill="var(--muted)" opacity=".8">Birchwood Park</text>`;
  // yard
  g += `<rect x="${YARD.x - 16}" y="${YARD.y - 16}" width="32" height="32" rx="6" fill="var(--ink)"/><text x="${YARD.x}" y="${YARD.y + 6}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">Y</text>`;
  if (!crewOnly) {
    for (const [id, c] of Object.entries(S.oth)) {
      const pts = c.route.map((p) => p.join(",")).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="var(${c.color})" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>`;
      c.route.slice(1).forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${i < c.done ? `var(${c.color})` : "var(--surface)"}" stroke="var(${c.color})" stroke-width="3"/>`; });
    }
  }
  const pts = [YARD, ...S.stops].map((p) => p.x + "," + p.y).join(" ");
  g += `<polyline points="${pts}" fill="none" stroke="var(--c2)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>`;
  for (const d of Object.values(S.dev)) if (!crewOnly || d.id === "c2") g += `<polyline points="${(!crewOnly && d.id === "c2" && S.net.snap ? d.trail.slice(0, S.net.snap.trailLen) : d.trail).map((q) => q.x.toFixed(0) + "," + q.y.toFixed(0)).join(" ")}" fill="none" stroke="var(${d.color})" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>`;
  S.stops.forEach((s, i) => {
    const isCur = s.id === S.cur;
    const fill = s.status === "done" ? "var(--ok)" : isCur ? "var(--c2)" : s.status === "blocked" ? "var(--warn)" : s.status === "moved" ? "var(--map-land)" : "var(--surface)";

    g += `<circle cx="${s.x}" cy="${s.y}" r="${crewOnly ? 21 : 16}" fill="${fill}" stroke="var(--c2)" stroke-width="3"/><text x="${s.x}" y="${s.y + (crewOnly ? 7 : 6)}" text-anchor="middle" font-size="${crewOnly ? 19 : 15}" font-weight="700" fill="${txt}">${i + 1}</text>`;
    if (crewOnly) g += `<text x="${s.x}" y="${s.y - 30}" text-anchor="middle" font-size="17" fill="var(--ink)" font-weight="600">${esc(s.addr.split(" ").slice(0, 2).join(" "))}</text>`;
  });
  // crew dots
  for (const d of Object.values(S.dev)) {
    if (crewOnly && d.id !== "c2") continue;
    const live = devLive(d) && !(!crewOnly && d.id === "c2" && S.net.snap);
    const pos = !crewOnly && d.id === "c2" && S.net.snap ? S.net.snap.pos : d.pos;
    g += `<g><circle cx="${pos.x.toFixed(0)}" cy="${pos.y.toFixed(0)}" r="17" fill="${live ? `var(${d.color})` : "var(--muted)"}" stroke="var(--surface)" stroke-width="4"/><text x="${pos.x.toFixed(0)}" y="${(pos.y + 6).toFixed(0)}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--surface)">${live ? d.id.slice(1) : "!"}</text></g>`;
  }
  return `<svg class="map" id="mapsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("map")}">${g}</svg>`;
}
function lerp(a, b, f) { return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }; }
const devLive = (d) => (d.id === "c2" ? S.clockedIn && d.on : true);

  for (const d of Object.values(S.dev)) {

/* ================= offline outbox (simulated) ================= */
// Local-first: the crew screen always updates at once. While there is no signal, anything the office
// would see is held in S.outbox and replayed, in order, when signal returns.
function office(label, fn, kind, size) {
  if (S.net.online && !S.net.syncing) { if (fn) fn(); return; }
  S.outbox.push({ label, at: fmtT(now()), fn: fn || null, kind: kind || "data", size: size || 0 });
}
const queued = () => !S.net.online || S.net.syncing;
function goOffline() {
  if (!S.net.online) return;
  const cs = crewSummary().find((c) => c.id === "c2"), d = S.dev.c2;
  S.net = { online: false, since: fmtT(now()), syncing: false, total: 0,
    snap: { done: cs.done, rev: cs.rev, state: cs.state, at: cs.at, mins: cs.mins, late: cs.late, pauseTxt: cs.pauseTxt, pos: { ...d.pos }, trailLen: d.trail.length, km: d.km, lastFix: d.lastFix, doneIds: S.stops.filter((x) => x.status === "done").map((x) => x.id) } };
}
function goOnline() {
  if (S.net.online) return;
  S.net.online = true; S.net.syncing = true; S.net.total = S.outbox.length;
  const token = S;
  const step = () => {
    if (S !== token) return;
    const it = S.outbox.shift();
    if (it) { try { if (it.fn) it.fn(); } catch (e) { console.error(e); } }
    if (S.outbox.length) { setTimeout(step, S.outbox[0].kind === "photo" ? 700 : 220); }
    else { const n = S.net.total; S.net.syncing = false; S.net.snap = null; S.net.total = 0; toast(t("t_synced", { n })); }
    render();
  };
  if (S.outbox.length) setTimeout(step, 600); else { S.net.syncing = false; S.net.snap = null; }
}
function netChip() {
  const n = S.outbox.length;
  if (!S.net.online) return `<button class="netchip off" data-act="outbox">${I.wifiOff}${t("netOff", { n })}</button>`;
  if (S.net.syncing) return `<button class="netchip sync" data-act="outbox">${I.sync}${t("netSync", { n })}</button>`;
  return "";
}
function gpsWaiting() { return S.net.snap ? Math.max(0, S.dev.c2.trail.length - S.net.snap.trailLen) : 0; }
function doOutbox() {
  const photos = S.outbox.filter((x) => x.kind === "photo"), mb = photos.reduce((a, x) => a + x.size, 0).toFixed(1);
  const icon = (k) => (k === "photo" ? I.cam.replace('class="cam"', "") : k === "text" ? I.nav : I.cloud);

    ${photos.length ? `<div class="chips" style="margin:0"><span class="chip">${t("obPhotos", { n: photos.length, mb })}</span>${gpsWaiting() ? `<span class="chip">${t("obGps", { n: gpsWaiting() })}</span>` : ""}</div>` : gpsWaiting() ? `<div class="chips" style="margin:0"><span class="chip">${t("obGps", { n: gpsWaiting() })}</span></div>` : ""}
    <div>${S.outbox.length ? S.outbox.map((x) => `<div class="obrow">${icon(x.kind)}<span>${esc(x.label)}</span><span class="tm">${x.at}</span></div>`).join("") : `<p class="muted">${t("obEmpty")}</p>`}</div>

function crewSummary() {

  else if (!cur) state = "fin";

  else if (cur.status === "enroute") state = "drive";
  else { state = "at"; at = S.stops.filter((s) => s.status === "done").slice(-1)[0]?.addr || at; mins = 0; }
  const list = [

/* ── Finance overview (owners) ──
   Sample numbers shaped like the real app's finance_summary. Labour follows the hourly costs
   entered under Costs and rates, so changing a rate changes the profit. */
function finData() {
  const k = S.finKind, scale = k === "day" ? 1 : k === "week" ? 5.6 : 23, drift = 1 - 0.035 * S.finOff;
  const avgRate = Object.values(S.rates).reduce((a, b) => a + b, 0) / Object.keys(S.rates).length;
  // per crew per working day: revenue $, paid hours, jobs, leads spotted / won per week, complaints per week
  const crews = [["c2", 1720, 8.6, 9, 4, 2, 0], ["c1", 1600, 8.5, 8, 3, 2, 1], ["c4", 1400, 8.1, 8, 2, 1, 0], ["c3", 1180, 8.9, 6, 2, 0, 1]];
  const wk = scale / 5.6;
  const rows = crews.map(([id, rev, hrs, jobs, lc, lw, comp]) => {
    const r = rev * scale * drift, h = hrs * scale, labour = h * 2.6 * avgRate;
    return { id, rev: r, labour, fuel: r * 0.045, mat: r * 0.07, truck: h * 4.1, jobs: Math.round(jobs * scale), mins: Math.round(h * 0.78 * 60), lc: Math.round(lc * wk), lw: Math.round(lw * wk), comp: Math.round(comp * wk) };
  });
  const sum = (f) => rows.reduce((a, r) => a + f(r), 0);
  const revenue = sum((r) => r.rev), labour = sum((r) => r.labour), fuel = sum((r) => r.fuel), mat = sum((r) => r.mat), truck = sum((r) => r.truck);
  rows.forEach((r) => (r.profit = r.rev - r.labour - r.fuel - r.mat - r.truck));
  const jobs = sum((r) => r.jobs), comp = sum((r) => r.comp);
  return { revenue, labour, fuel, mat, truck, profit: revenue - labour - fuel - mat - truck, jobs, comp, rows,
    mix: [revenue * 0.723, revenue * 0.148, revenue * 0.107, revenue * 0.022], leads: { created: sum((r) => r.lc), won: sum((r) => r.lw), open: Math.max(0, sum((r) => r.lc) - sum((r) => r.lw) - 1) } };
}

    case "finish": return doFinish();
    case "check": { const c = (S.checks[s.id] = S.checks[s.id] || {}); c[b.dataset.k] = !c[b.dataset.k]; if (c[b.dataset.k]) office(t("lb_check", { k: t(b.dataset.k), a: s.addr })); break; }
    case "photo": { const k = b.dataset.k; return askPhoto({ kind: k, n: S.stops.indexOf(s) + 1 }, (url) => { (S.photos[s.id] = S.photos[s.id] || {})[k] = url; office(t("lb_photo", { k: t(k), a: s.addr }), null, "photo", 2.4); render(); }); }
    case "cant": return doCant();
    case "spot": return doSpot();
    case "mat": return doMat();
    case "voice": return doVoice();
    case "pre": S.preTrip[b.dataset.k] = !S.preTrip[b.dataset.k]; break;
    case "issue": return doIssue(b.dataset.n);
    case "oTab": S.ownerTab = b.dataset.k; S.lastSub[groupOf(b.dataset.k)] = b.dataset.k; break;
    case "nsType": { const nx = (S.next[s.id] = S.next[s.id] || {}); nx.type = b.dataset.k; nx.auto = false; break; }
    case "nsOpen": S.next[s.id].open = true; break;
    case "prop": return doProp(b.dataset.addr);
    case "oGroup": { const g = b.dataset.k; S.ownerTab = S.lastSub[g] || GROUPS[g][0]; break; }
    case "nsDate": { const nx = (S.next[s.id] = S.next[s.id] || {}); const d = new Date(START); d.setDate(d.getDate() + +b.dataset.d); nx.days = +b.dataset.d; nx.date = isoDate(d); break; }
    case "nsVoice": (S.next[s.id] = S.next[s.id] || {}).note = t("sampleNext"); break;
    case "aRange": S.aRange = b.dataset.k; break;
    case "assign": doAssign(S.jobs.find((j) => j.id === b.dataset.id), b.dataset.c); break;
    case "unassign": doUnassign(S.jobs.find((j) => j.id === b.dataset.id)); break;
    case "chDay": return doChDay(S.jobs.find((j) => j.id === b.dataset.id));
    case "filter": S.filter = b.dataset.k && S.filter !== b.dataset.k ? b.dataset.k : null; break;
    case "resolve": if (b.dataset.a === "setpw") { const it = S.items.find((i) => i.id === b.dataset.id); return doSetPw(it ? it.who : "", b.dataset.id); }
      S.items = S.items.filter((i) => i.id !== b.dataset.id); toast(t(b.dataset.a) + " · " + t("resolved")); break;
    case "rain": return doRain();
    case "net": if (b.dataset.v === "off") goOffline(); else goOnline(); break;
    case "outbox": return doOutbox();
    case "locOff": S.dev.c2.on = false; S.dev.c2.offSince = fmtT(now()); break;
    case "locOn": S.dev.c2.on = true; S.dev.c2.offSince = null; closeSheet(); break;
    case "receipt": return doReceipt();
    case "odo": return doOdo();
    case "calib": S.trucks[b.dataset.c].l100 = +b.dataset.v; toast(t("t_calib")); break;
    case "newJob": return doNewJob();
    case "rainUndo": if (S.rain) { S.stops.forEach((x, i) => x.status = S.rain.prev[i]); S.cur = S.rain.cur; S.rain = null; } break;
    case "q": S.quality[b.dataset.id] = b.dataset.v; break;
    case "csv": {
      const csv = "person,crew,mon,tue,wed,thu,fri,sat,total\n" + PEOPLE.map(([n, c, d]) => [n, c, ...d, d.reduce((x, y) => x + y, 0).toFixed(1)].join(",")).join("\n");
      try { navigator.clipboard.writeText(csv).then(() => toast(t("copied")), () => toast(t("copied"))); } catch (_) { toast(t("copied")); }
      break;
    }
  }
  render();
});

function render() {
  document.querySelectorAll("[data-t]").forEach((el) => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-act="view"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.view));
  document.querySelectorAll('[data-act="lang"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.querySelectorAll('[data-act="net"]').forEach((b) => b.setAttribute("aria-pressed", (b.dataset.v === "on") === S.net.online));
  $("#crew").hidden = S.view !== "crew"; $("#crew-tabs").hidden = S.view !== "crew"; $("#owner").hidden = S.view === "crew";
  if (S.view === "crew") renderCrew(); else renderOwner();
}
document.addEventListener("input", (e) => {
  if (e.target.id === "prop-q") { S.propQ = e.target.value; const l = $("#prop-list"); if (l) l.innerHTML = propRows(); return; }
  if (e.target.id === "ns-note") { const s = curStop(); if (s) { (S.next[s.id] = S.next[s.id] || {}).note = e.target.value; updateGate(); } }
});
document.addEventListener("change", (e) => {
  const el = e.target, v = parseFloat(el.value);
  if (el.id === "fuel-price" && v > 0) { S.price = isMi() ? v / 3.78541 : v; renderOwner(); return; }
  if (el.id === "units") { S.units = el.value; renderOwner(); return; }
  if (el.dataset && el.dataset.rate && v >= 0) { S.rates[el.dataset.rate] = v; toast(t("saved")); return; }
  if (el.id === "ot-after" && v > 0) { S.otAfter = v; toast(t("saved")); return; }
  if (el.id === "ot-x" && v >= 1) { S.otx = v; toast(t("saved")); return; }
  if (el.id === "fin-target" && v > 0) { S.target = v; toast(t("saved")); return; }
  if (el.id === "er-w") { S.rep.weekly = el.checked; renderOwner(); return; }
  if (el.id === "er-m") { S.rep.monthly = el.checked; return; }
  if (el.id === "er-day") { S.rep.day = +el.value; return; }
  if (el.id === "er-to") { S.rep.to = el.value; return; }
  if (el.id === "idle-min" && v >= 0) { S.idleMin = v; renderOwner(); return; }
  if (el.dataset && el.dataset.truck && v > 0) { S.trucks[el.dataset.truck].l100 = isMi() ? 235.215 / v : v; renderOwner(); return; }
  if (e.target.id === "ns-date") { const s = curStop(); if (s) { const nx = (S.next[s.id] = S.next[s.id] || {}); nx.date = e.target.value; nx.days = null; render(); } }
});
// live ticks: GPS fixes, timers, map, team list
setInterval(() => {
  gpsTick();
  if ($("#layer").innerHTML) return;
  if (S.pause) { const pt = $("#pause-timer"); if (pt) pt.textContent = mmss(); const hp = $("#hdr-pause"); if (hp) hp.textContent = mmss(); }
  const tm = $("#site-timer"); const s = curStop();
  if (tm && s && s.arrived) tm.textContent = `${elapsedMin(s.arrived)} ${t("min")} / ${s.est}`;
  const gl = $("#gpsline"); if (gl && s) { const tmp = document.createElement("div"); tmp.innerHTML = gpsLine(s); if (tmp.firstChild) gl.replaceWith(tmp.firstChild); }
  const m = $("#mapsvg");
  if (m) { const tmp = document.createElement("div"); tmp.innerHTML = mapSVG({ crewOnly: S.view === "crew" }); m.replaceWith(tmp.firstChild); }
  const tr = $("#teamrows"); if (tr) tr.innerHTML = teamRows();
  const ft = $("#fueltoday"); if (ft) ft.innerHTML = fuelTodayTable();
}, 1000);
render();
})();
</script>
</body></html>
