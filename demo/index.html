<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style><title>Cutting Cost Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone column for the crew; the office widens to a side menu and columns on desktop.
   Palette "Work truck": cab slate, safety yellow for the one action that matters, plain white. Yellow is a background only;
   text in the brand colour uses --accent-text. */
:root {
  --bg: #eceff3; --surface: #ffffff; --sunken: #e3e7ec; --ink: #141b24; --muted: #4b5765; --line: #c9d0d9;
  --accent: #ffc414; --accent-ink: #141b24; --accent-soft: #fff1c2; --accent-text: #1c2733; --focus: #1f5fbf;
  --brand: #1c2733; --brand-ink: #f4f6f8;
  --brass: #8a5a00; --brass-soft: #fdf0cf; --ok: #17733f; --ok-soft: #d9efe1;
  --warn: #a84f00; --warn-soft: #fde4cc; --bad: #c0281f; --bad-soft: #fad9d5;
  --bar: #1c2733; --bar-ink: #f4f6f8;
  --map-land: #e3e7ec; --map-park: #d3e2cf; --map-water: #cfdeea; --map-road: #ffffff; --map-main: #f7e7b8;
  --c1: #2a78d6; --c2: #8a5cd0; --c3: #0f8f92; --c4: #c2477f;
  --shade: rgba(16, 24, 20, 0.4);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #17202a; --sunken: #0a0f15; --ink: #f1f4f7; --muted: #9ba7b5; --line: #2c3846;
    --accent: #ffcc29; --accent-ink: #10161d; --accent-soft: #3a3110; --accent-text: #ffcc29; --focus: #ffcc29;
    --brand: #0a0f15; --brand-ink: #f1f4f7; --brass: #ffcc29; --brass-soft: #2e2810;
    --ok: #4cc27a; --ok-soft: #12301f; --warn: #f29a3a; --warn-soft: #3a2610; --bad: #f0675c; --bad-soft: #3d1714;
    --bar: #0a0f15; --bar-ink: #f1f4f7;
    --map-land: #1a232e; --map-park: #1d2e27; --map-water: #18283a; --map-road: #2a3542; --map-main: #4a3f1c;
    --c1: #5b9be8; --c2: #a888e6; --c3: #2bb3b5; --c4: #e07aa8;
    --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #17202a; --sunken: #0a0f15; --ink: #f1f4f7; --muted: #9ba7b5; --line: #2c3846;
  --accent: #ffcc29; --accent-ink: #10161d; --accent-soft: #3a3110; --accent-text: #ffcc29; --focus: #ffcc29;
  --brand: #0a0f15; --brand-ink: #f1f4f7; --brass: #ffcc29; --brass-soft: #2e2810;
  --ok: #4cc27a; --ok-soft: #12301f; --warn: #f29a3a; --warn-soft: #3a2610; --bad: #f0675c; --bad-soft: #3d1714;
  --bar: #0a0f15; --bar-ink: #f1f4f7;
  --map-land: #1a232e; --map-park: #1d2e27; --map-water: #18283a; --map-road: #2a3542; --map-main: #4a3f1c;
  --c1: #5b9be8; --c2: #a888e6; --c3: #2bb3b5; --c4: #e07aa8;
  --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* demo bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bar); }
.demo-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); color: var(--bar-ink); padding-block: 8px; }
.demo-bar .in { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
.demo-bar .lbl { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--bar-ink) 35%, transparent); border-radius: 6px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-ink); padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.demo-bar .sp { flex: 1; }
@media (max-width: 480px) { .demo-bar .lbl { display: none; } .demo-bar .ghost { padding: 6px 10px; } }
.demo-bar .ghost { background: transparent; border: 1px solid color-mix(in srgb, var(--bar-ink) 35%, transparent); color: var(--bar-ink); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; min-height: 36px; }

/* banners */
.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
.banner.rain { background: var(--c1); color: #fff; }
:root[data-theme="dark"] .banner.rain { color: #0c1512; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner.rain { color: #0c1512; } }
.banner b { display: block; }
.banner button { margin-left: auto; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; white-space: nowrap; }

/* ---------- crew screen ---------- */
[hidden] { display: none !important; }
#crew { max-width: 480px; margin: 0 auto; padding-block: 12px 96px; display: flex; flex-direction: column; gap: 14px; }
.crew-head { display: flex; align-items: center; gap: 12px; }
.crew-head .who { flex: 1; min-width: 0; }
.crew-head .who h1 { font-size: 1.45rem; }
.crew-head .who span { color: var(--muted); font-size: 0.9rem; }
.clock { border: 0; border-radius: 6px; padding: 10px 16px; min-height: 48px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.clock.out { background: var(--accent); color: var(--accent-ink); }
.clock.in { background: var(--ok-soft); color: var(--ok); }
.clock .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.clock.in .dot { animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress i.d { background: var(--accent); }
.progress i.b { background: var(--warn); }
.progress i.m { background: var(--c1); opacity: 0.5; }
.progress-txt { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

.job { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.job.current { border: 2px solid var(--brand); box-shadow: 0 6px 24px -12px var(--shade); }
.job-top { padding: 16px 16px 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.stopno { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--brand); color: var(--accent); font-size: 1.1rem; }
.job-top h2 { font-size: 1.35rem; }
.job-top .addr { font-size: 1rem; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--sunken); color: var(--muted); }
.chip.freq { background: var(--accent-soft); color: var(--accent-text); }
.chip.season { background: var(--brass-soft); color: var(--brass); }
.chip.app { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.blue { background: color-mix(in srgb, var(--c1) 18%, transparent); color: var(--c1); }
.notes { margin: 0 16px 12px; border-radius: 6px; background: var(--brass-soft); padding: 10px 12px; display: grid; gap: 6px; }
.note { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font-size: 0.97rem; }
.note svg { width: 22px; height: 22px; color: var(--brass); }
.note b { font-weight: 600; }
.sec-label { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 16px 6px; }
.checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 14px; }
.check { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; min-height: 52px; padding: 8px 12px; text-align: left; font-weight: 600; }
.check .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.check[aria-pressed="true"] { border-color: var(--brand); background: var(--surface); }
.check[aria-pressed="true"] .box { background: var(--brand); border-color: var(--brand); color: var(--accent); }
.check:disabled { opacity: 0.55; cursor: default; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 14px; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 6px; border: 2px dashed var(--line); background: var(--sunken); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 0.85rem; overflow: hidden; padding: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .tag { position: absolute; left: 6px; top: 6px; background: var(--bar); color: var(--bar-ink); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }

.main-act { margin: 0 16px; }
.nextbox { margin: 0 16px 14px; display: grid; gap: 10px; border: 1.5px dashed var(--line); border-radius: 6px; padding: 12px; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; min-height: 44px; font-weight: 600; font-size: 0.92rem; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.notein { display: grid; grid-template-columns: 1fr 52px; gap: 8px; }
.notein input { min-width: 0; }
.notein button { padding: 0; display: grid; place-items: center; }
.notein button svg { width: 22px; height: 22px; }
.crewpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
@media (min-width: 560px) { .crewpick { grid-template-columns: repeat(4, 1fr); } }
.crewpick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; min-height: 52px; padding: 6px 10px; text-align: left; font-weight: 600; font-size: 0.9rem; display: grid; grid-template-columns: 12px 1fr; column-gap: 8px; align-items: center; }
.crewpick i { width: 12px; height: 12px; border-radius: 50%; background: var(--cc); grid-row: span 2; }
.crewpick small { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.crewpick small.o { color: var(--bad); font-weight: 600; }

.ntile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 0.82rem; padding: 6px 4px; text-align: center; }
.ntile svg { width: 28px; height: 28px; color: var(--brass); }
.ntile[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); box-shadow: inset 0 0 0 1px var(--brass); }
.npanel { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; background: var(--brass-soft); border-radius: 6px; padding: 10px; }
.nic { width: 40px; height: 40px; border-radius: 6px; background: var(--surface); display: grid; place-items: center; color: var(--brass); }
.nic svg { width: 24px; height: 24px; }
.lic svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--brass); }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.nchip { display: inline-flex; align-items: center; gap: 5px; background: var(--brass-soft); color: var(--brass); border-radius: 6px; padding: 3px 10px 3px 6px; font-size: 0.8rem; font-weight: 600; }
.nchip svg { width: 16px; height: 16px; }
.gpsline { display: flex; gap: 6px; justify-content: center; align-items: center; font-size: 0.88rem; font-weight: 600; color: var(--c1); margin: 6px 16px 0; }
.gpsline svg { width: 16px; height: 16px; }
.gpsline.ok { color: var(--ok); }
.gpschip { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 600; }
.gpschip svg { width: 14px; height: 14px; }
.gpschip.off { color: var(--bad); }
.locoff { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.locoff .nic { width: 64px; height: 64px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; }
.locoff .nic svg { width: 32px; height: 32px; }
.locoff p { margin: 0; max-width: 36ch; }
.setrow { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.setrow input, .setrow select { min-height: 44px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 10px; font: inherit; width: 100%; min-width: 0; }
.note-sm { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; }
.subtabs { display: flex; gap: 4px; overflow-x: auto; margin-top: -6px; scrollbar-width: none; }
.subtabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); min-height: 40px; white-space: nowrap; }
.subtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.headline { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.headline > div:first-child { min-width: 0; }
.headline b { font-family: var(--font-display); font-size: 1.4rem; display: block; line-height: 1.2; }
.headline span { color: var(--muted); }
.hl-need { text-align: center; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 14px; flex: none; }
.hl-need b { font-size: 1.8rem; }
.hl-need span { color: inherit; font-size: 0.8rem; font-weight: 600; }
.hl-need.ok { background: var(--ok-soft); color: var(--ok); }
.fchips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px; scrollbar-width: none; }
.fchips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.85rem; white-space: nowrap; min-height: 38px; }
.fchips button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.fchips em { font-style: normal; margin-left: 6px; opacity: 0.7; }
.linkb { border: 0; background: none; padding: 0; font-weight: 700; font-size: 1rem; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; display: block; }
.proplink { display: inline-flex; gap: 6px; align-items: center; border: 0; background: var(--sunken); color: var(--ink); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; min-height: 36px; }
.proplink svg { width: 16px; height: 16px; }
.hist { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.hist .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 8px; overflow: hidden; }
.hist img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.hist b { display: block; }
.hist span { font-size: 0.85rem; color: var(--muted); display: block; }
.note.ed { grid-template-columns: 26px 1fr 36px; }
.nx { border: 0; background: var(--surface); border-radius: 8px; width: 32px; height: 32px; font-size: 1.2rem; line-height: 1; color: var(--bad); }
.nextsum { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; }
.nextsum svg { width: 22px; height: 22px; color: var(--ok); }
.nextsum b { display: block; }
.nextsum span { font-size: 0.85rem; color: var(--muted); }
.nextbox.compact { border-style: solid; background: var(--ok-soft); border-color: transparent; }
.shift-hero h2 { font-size: 1.6rem; }
.shift-hero p { margin: 4px 0 0; color: var(--muted); font-size: 1.05rem; }
.shiftlist .opt { min-height: 60px; font-size: 1.08rem; }
.precount { text-align: center; font-weight: 600; margin: 12px 0; font-size: 1.05rem; }
.gpsready { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 12px; font-weight: 600; }
.gpsready svg { width: 20px; height: 20px; }
.gpsready.off { background: var(--bad-soft); color: var(--bad); }
.bigopt { min-height: 76px; font-size: 1.15rem; }
.bigopt svg { width: 32px; height: 32px; flex: none; color: var(--accent-text); }
.bigopt small { font-size: 0.9rem; }
.bigopt.danger { color: var(--bad); }
.bigopt.danger svg { color: var(--bad); }
.pausecard { text-align: center; display: grid; gap: 14px; justify-items: center; padding-block: 28px; }
.pausecard .nic { width: 72px; height: 72px; border-radius: 18px; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; }
.pausecard .nic svg { width: 40px; height: 40px; }
.pausecard h2 { font-size: 1.6rem; }
.pausecard p { margin: 0; font-size: 1.02rem; }
.ptime { font-family: var(--font-display); font-size: 3.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.cocard { display: grid; gap: 14px; }
.cocard h2 { font-size: 1.6rem; }
.sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sumgrid div { background: var(--sunken); border-radius: 6px; padding: 12px; }
.sumgrid span { display: block; color: var(--muted); font-size: 0.95rem; }
.sumgrid b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.big.ghostbig { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.clock.pause { background: var(--brass-soft); color: var(--brass); }
.clock.idle { background: var(--sunken); color: var(--muted); }
.clock svg { width: 18px; height: 18px; }
.netchip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 6px; padding: 8px 14px; min-height: 44px; font-weight: 700; font-size: 0.95rem; }
.netchip svg { width: 20px; height: 20px; }
.netchip.off { background: var(--warn-soft); color: var(--warn); }
.netchip.sync { background: color-mix(in srgb, var(--c1) 18%, transparent); color: var(--c1); }
.netchip.sync svg { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner.offline { background: var(--warn-soft); color: var(--ink); }
.banner.offline svg { color: var(--warn); flex: none; }
.obrow { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 1rem; }
.obrow:first-of-type { border-top: 0; }
.obrow svg { width: 24px; height: 24px; color: var(--muted); }
.obrow .tm { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.obbar { height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.obbar span { display: block; height: 100%; background: var(--c1); transition: width 0.3s; }
.login { display: grid; gap: 14px; max-width: 420px; margin: 0 auto; width: 100%; padding-top: 8px; }
.login h1 { font-size: 2rem; }
.logo { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--brand); color: var(--accent-text); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; line-height: 1; font-size: 1.15rem; letter-spacing: 0.06em; justify-self: center; margin: 4px 0 10px; }
.logo span:last-child { color: var(--accent-ink); background: var(--accent); padding: 3px 8px 2px; margin-top: 5px; border-radius: 3px; }
.login .field input { font-size: 1.1rem; min-height: 56px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 48px; font-size: 1.02rem; justify-self: center; }
.lg-err { color: var(--bad); font-weight: 600; margin: 0; min-height: 1.2em; }
.okmsg { color: var(--ok); font-weight: 600; }
:root { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; } }
:root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; }
.fhero { display: grid; gap: 16px; }
@media (min-width: 760px) { .fhero { grid-template-columns: auto 1fr; align-items: center; } .fhero .target { grid-column: 1 / -1; } }
.eyebrow { margin: 0; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero-num { margin: 2px 0; font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.hero-side div { background: var(--sunken); border-radius: 6px; padding: 10px 12px; }
.hero-side span { display: block; color: var(--muted); font-size: 0.85rem; }
.hero-side b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.delta { font-size: 0.8rem; font-weight: 600; }
.delta.good { color: var(--ok); } .delta.bad { color: var(--bad); }
.meter { height: 10px; background: var(--sunken); border-radius: 5px; overflow: hidden; margin-top: 6px; }
.meter span { display: block; height: 100%; background: var(--brand); }
.watch { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.watch li { display: flex; gap: 10px; align-items: baseline; }
.watch i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.watch .bad i { background: var(--bad); } .watch .warn i { background: var(--warn); }
.splitbar { display: flex; gap: 2px; height: 22px; margin: 4px 0 12px; }
.splitbar span { min-width: 4px; }
.splitbar span:first-child { border-radius: 4px 0 0 4px; } .splitbar span:last-child { border-radius: 0 4px 4px 0; }
.sg-1 { background: var(--series-1); } .sg-2 { background: var(--series-2); } .sg-3 { background: var(--series-3); } .sg-4 { background: var(--series-4); }
.legend-t { width: 100%; border-collapse: collapse; }
.legend-t td { padding: 6px 0; border-top: 1px solid var(--line); }
.legend-t tr:first-child td { border-top: 0; }
.legend-t td:first-child { white-space: normal; }
.legend-t i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
tr.loss td.pf { color: var(--bad); font-weight: 700; }
.ctag { display: inline-block; margin-left: 6px; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); }
.setrow input.money { width: 110px; }
.emailprev { border: 1px solid var(--line); border-radius: 6px; padding: 20px; background: #ffffff; color: #16201c; }
.emailprev h3 { margin: 6px 0 4px; font-size: 1.5rem; }
.emailprev table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.emailprev td { padding: 5px 0; }
.emailprev .k { color: #5a6962; }
.adminrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.adminrow:first-of-type { border-top: 0; }
.rainbtn.newjob { background: var(--accent); color: var(--accent-ink); }
.ld { padding: 10px 0; border-top: 1px solid var(--line); }
.ld:first-of-type { border-top: 0; padding-top: 2px; }
.ld-h { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; flex-wrap: wrap; }
.ld-h i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; }
.cells span { width: 14px; height: 14px; border-radius: 3px; background: var(--accent-soft); }
.cells span.f { background: var(--accent); } .cells span.o { background: var(--bad); } .cells span.off { background: var(--sunken); }
.big { width: 100%; min-height: 64px; border: 0; border-radius: 6px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 10px; }
.big.onway { background: var(--c1); color: #fff; }
.big.done { background: var(--ok); color: #fff; }
.big:disabled { opacity: 0.45; cursor: not-allowed; }
.hint { font-size: 0.85rem; color: var(--muted); text-align: center; margin: 6px 16px 0; min-height: 1.2em; }
.timer { margin: 0 16px 12px; display: flex; justify-content: space-between; align-items: center; background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 8px 12px; font-weight: 600; }
.sub-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 10px 14px; border-top: 1px solid var(--line); margin-top: 14px; }
.sub-acts button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 6px 2px; border-radius: 6px; min-height: 64px; }
.sub-acts button svg { width: 26px; height: 26px; }
.sub-acts button.warnbtn { color: var(--bad); }
.sub-acts button:hover { background: var(--sunken); }
.log { margin: 0 16px; display: grid; gap: 6px; }
.log div { font-size: 0.88rem; background: var(--sunken); border-radius: 8px; padding: 6px 10px; }

.list-h { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; text-align: left; width: 100%; min-height: 64px; }
.row .stopno { width: 34px; height: 34px; font-size: 0.95rem; background: var(--sunken); color: var(--ink); }
.row.done .stopno { background: var(--ok-soft); color: var(--ok); }
.row.blocked .stopno { background: var(--warn-soft); color: var(--warn); }
.row.moved { opacity: 0.6; }
.row b { display: block; font-size: 1rem; }
.row span { font-size: 0.85rem; color: var(--muted); }
.row .r { font-size: 0.82rem; color: var(--muted); text-align: right; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { border: 0; background: transparent; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-pressed="true"] { color: var(--accent-text); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card h3 { font-size: 1.1rem; margin-bottom: 8px; }
.eq { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.eq:first-of-type { border-top: 0; }
.eq b { font-weight: 600; }
.eq span { font-size: 0.85rem; color: var(--muted); grid-column: 1; }
.small-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 0.9rem; min-height: 44px; }
.small-btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.small-btn.bad { color: var(--bad); }

/* map */
.map { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--map-land); border: 1px solid var(--line); }
.map text { font-family: var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 0.85rem; margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--shade); z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 6px 12px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet h2 { font-size: 1.35rem; }
.sheet p { margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { min-height: 56px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; gap: 12px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt small { display: block; font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opts.three .opt, .opts.two .opt { justify-content: center; text-align: center; }
.sheet-acts { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 4px; }
.sheet-acts button { min-height: 56px; border-radius: 6px; font-weight: 700; font-size: 1.05rem; border: 1.5px solid var(--line); background: var(--surface); }
.sheet-acts .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet-acts .go:disabled { opacity: 0.45; }
.consent { border-radius: 6px; padding: 10px 12px; font-size: 0.92rem; }
.consent.yes { background: var(--ok-soft); color: var(--ok); }
.consent.no { background: var(--sunken); color: var(--muted); }
.sms { background: var(--sunken); border-radius: 8px 14px 14px 4px; padding: 10px 12px; font-size: 0.93rem; max-width: 92%; }
.sms img { border-radius: 8px; margin-top: 6px; max-height: 140px; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 52px; font-weight: 600; }
.switch input { width: 24px; height: 24px; accent-color: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 0.92rem; }
.field input, .field select { min-height: 52px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; font-size: 1.05rem; font-family: var(--font-body); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.stepper button { min-height: 52px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.4rem; font-weight: 700; }
.stepper output { text-align: center; font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--bad); color: #fff; display: grid; place-items: center; margin: 6px auto; }
.mic svg { width: 40px; height: 40px; }
.mic.rec { animation: pulse 1s infinite; }
.lock { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 10px 12px; font-size: 0.92rem; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--bar); color: var(--bar-ink); padding: 12px 18px; border-radius: 6px; font-weight: 500; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 30px -8px var(--shade); }

/* ---------- owner screen ---------- */
#owner { max-width: 1600px; margin: 0 auto; padding-block: 14px 48px; display: flex; flex-direction: column; gap: 16px; }
.o-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.o-head .t { flex: 1; min-width: 200px; }
.o-head h1 { font-size: 1.6rem; }
.o-head .t span { color: var(--muted); }
.rainbtn { border: 0; background: var(--c1); color: #fff; border-radius: 6px; min-height: 48px; padding: 8px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.rainbtn svg { width: 22px; height: 22px; }
.o-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.o-tabs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 16px; font-weight: 600; white-space: nowrap; min-height: 44px; }
.o-tabs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); box-shadow: inset 0 -3px 0 var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 820px) { .tiles { grid-template-columns: repeat(6, 1fr); } }
.tile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 92px; position: relative; }
.tile b { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); } .tile.acc b { color: var(--accent-text); } .tile.brass b { color: var(--brass); }
.tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.o-grid { display: grid; gap: 16px; }
@media (min-width: 900px) { .o-grid { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel > h2 { font-size: 1.15rem; display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.panel > h2 small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 0.85rem; }
.item { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 2px; }
.item .stripe { border-radius: 3px; background: var(--line); }
.item .stripe.bad { background: var(--bad); } .item .stripe.warn { background: var(--warn); } .item .stripe.acc { background: var(--accent); } .item .stripe.brass { background: var(--brass); } .item .stripe.blue { background: var(--c1); }
.item .k { font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.item b { display: block; }
.item p { margin: 2px 0 0; font-size: 0.93rem; color: var(--muted); }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.item img.thumb { width: 96px; border-radius: 8px; margin-top: 8px; display: block; }
.crewrow { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.crewrow:first-of-type { border-top: 0; padding-top: 2px; }
.crewrow i { width: 24px; height: 24px; border-radius: 50%; margin-top: 0; color: #fff; font-style: normal; font-size: 0.78rem; font-weight: 700; display: grid; place-items: center; }
.crewrow b { display: block; }
.crewrow .st { font-size: 0.92rem; }
.crewrow .ppl { font-size: 0.82rem; color: var(--muted); }
.crewrow .r { text-align: right; font-size: 0.85rem; }
.crewrow .r strong { font-family: var(--font-display); font-size: 1.15rem; display: block; }
.minibar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin-top: 6px; width: 100%; }
.minibar span { display: block; height: 100%; background: var(--brand); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.85rem; }
tr.tot td { font-weight: 700; border-bottom: 0; }
.flag { color: var(--warn); font-weight: 600; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.qcard { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.qcard .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); }
.qcard .pair div { position: relative; }
.qcard .pair img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.qcard .pair .tag { position: absolute; left: 6px; top: 6px; background: var(--bar); color: var(--bar-ink); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.qcard .meta { padding: 10px 12px; display: grid; gap: 8px; }
.qcard .meta b { display: block; }
.qcard .meta span { font-size: 0.85rem; color: var(--muted); }
.qcard .acts { display: flex; gap: 6px; }
.qcard .acts button { flex: 1; }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: 70px 1fr 74px; gap: 10px; align-items: center; font-size: 0.9rem; }
.bars .track { height: 22px; background: var(--sunken); border-radius: 5px; overflow: hidden; }
.bars .track span { display: block; height: 100%; border-radius: 5px; }
.bars .v { text-align: right; font-family: var(--font-mono); font-size: 0.85rem; }
.cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 180px; padding-top: 18px; }
.cols .c { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 0.78rem; }
.cols .c .bar { width: 100%; max-width: 44px; background: var(--brand); border-radius: 5px 5px 0 0; }
.cols .c.today .bar { background: repeating-linear-gradient(135deg, var(--brand) 0 6px, var(--accent) 6px 10px); }
.cols .c .v { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kv div { background: var(--sunken); border-radius: 6px; padding: 10px 12px; }
.kv b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.kv span { font-size: 0.85rem; color: var(--muted); }
.rules { font-size: 0.9rem; background: var(--brass-soft); border-radius: 6px; padding: 12px 14px; }
.rules b { color: var(--brass); }
.foot { font-size: 0.82rem; color: var(--muted); text-align: center; padding-block: 8px; }
.sms-log div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
.sms-log div:first-child { border-top: 0; }
/* ── office shell: side menu on desktop, tabs on smaller screens ── */
.oshell { display: block; }
.topnav { display: flex; flex-direction: column; gap: 10px; }
.omain { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.oside { display: none; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.oside .g { border: 0; background: transparent; text-align: left; font-weight: 700; padding: 8px 10px; border-radius: 9px; min-height: 42px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.oside .g:hover, .oside .s:hover { background: var(--sunken); }
.oside .g[aria-current="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: inset 3px 0 0 var(--accent); }
.oside .s { border: 0; background: transparent; text-align: left; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 22px; border-radius: 8px; min-height: 36px; }
.oside .s[aria-current="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.oside .keys { margin-top: 14px; font-size: 0.82rem; color: var(--muted); border: 0; background: none; text-align: left; padding: 6px 10px; }
.cnt { background: var(--bad); color: #fff; border-radius: 6px; padding: 0 8px; font-size: 0.78rem; font-weight: 700; min-width: 22px; text-align: center; line-height: 1.6; }
.o-tabs .cnt { margin-left: 6px; }
@media (min-width: 1100px) {

function lawnPhoto(kind, seed) {
  const r = rnd(seed + (kind === "after" ? 7 : 0));
  let g = "";
  g += '<rect width="400" height="300" fill="#5d8a3c"/>';
  g += '<rect y="0" width="400" height="58" fill="#6b4f36"/>'; // garden bed
  for (let i = 0; i < 14; i++) g += `<circle cx="${(i * 31 + r() * 20) | 0}" cy="${(20 + r() * 26) | 0}" r="${(8 + r() * 10) | 0}" fill="${r() > 0.5 ? "#3f6b2a" : "#4f7d33"}"/>`;
  g += '<rect y="262" width="400" height="38" fill="#b9b6ad"/>'; // walkway
  if (kind === "after") {
    for (let i = 0; i < 8; i++) g += `<rect x="${i * 50}" y="58" width="25" height="204" fill="#79a94c" opacity=".55"/>`;
    g += '<rect y="258" width="400" height="4" fill="#3b2f22"/>';
  } else {
    for (let i = 0; i < 160; i++) { const x = r() * 400, y = 58 + r() * 204; g += `<path d="M${x | 0} ${y | 0}l${(r() * 6 - 3) | 0} -${(6 + r() * 10) | 0}" stroke="${r() > 0.5 ? "#476f2c" : "#7aa04e"}" stroke-width="2"/>`; }
    for (let i = 0; i < 46; i++) g += `<ellipse cx="${(r() * 400) | 0}" cy="${(60 + r() * 230) | 0}" rx="${(5 + r() * 5) | 0}" ry="3.5" fill="${["#c98a2c", "#a8562a", "#d9b24a", "#8a4b2a"][(r() * 4) | 0]}" transform="rotate(${(r() * 180) | 0} 200 150)"/>`;
    for (let i = 0; i < 10; i++) g += `<path d="M${(r() * 400) | 0} 262l${(r() * 8) | 0} -${(8 + r() * 8) | 0}" stroke="#4f7d33" stroke-width="2.5"/>`;
  }
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">${g}</svg>`);
}

  g += `<rect x="40" y="60" width="150" height="110" rx="14" fill="var(--map-park)"/><rect x="600" y="430" width="170" height="120" rx="14" fill="var(--map-park)"/>`;
  for (let x = 80; x < W; x += 110) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--map-road)" stroke-width="7"/>`;
  for (let y = 70; y < H - 60; y += 95) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--map-road)" stroke-width="7"/>`;
  g += `<path d="M0 520 L 1000 180" stroke="var(--map-main)" stroke-width="14"/>`;
  g += `<text x="610" y="500" font-size="20" fill="var(--muted)" opacity=".8">Birchwood Park</text>`;
  // yard
  g += `<rect x="${YARD.x - 16}" y="${YARD.y - 16}" width="32" height="32" rx="6" fill="var(--ink)"/><text x="${YARD.x}" y="${YARD.y + 6}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">Y</text>`;
  const op = (id) => (!crewOnly && S.focusCrew && S.focusCrew !== id ? 0.15 : 1);
  if (!crewOnly) {
    for (const [id, c] of Object.entries(S.oth)) {
      const pts = c.route.map((p) => p.join(",")).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="var(${c.color})" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" opacity="${0.7 * op(id)}"/>`;
      c.route.slice(1).forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${i < c.done ? `var(${c.color})` : "var(--surface)"}" stroke="var(${c.color})" stroke-width="3" opacity="${op(id)}"/>`; });

}

/* ================= offline outbox (simulated) ================= */
// Local-first: the crew screen always updates at once. While there is no signal, anything the office
// would see is held in S.outbox and replayed, in order, when signal returns.
function office(label, fn, kind, size) {
  if (S.net.online && !S.net.syncing) { if (fn) fn(); return; }
  S.outbox.push({ label, at: fmtT(now()), fn: fn || null, kind: kind || "data", size: size || 0 });
}
const queued = () => !S.net.online || S.net.syncing;
function goOffline() {
  if (!S.net.online) return;
  const cs = crewSummary().find((c) => c.id === "c2"), d = S.dev.c2;
  S.net = { online: false, since: fmtT(now()), syncing: false, total: 0,
    snap: { done: cs.done, rev: cs.rev, state: cs.state, at: cs.at, mins: cs.mins, late: cs.late, pauseTxt: cs.pauseTxt, pos: { ...d.pos }, trailLen: d.trail.length, km: d.km, lastFix: d.lastFix, doneIds: S.stops.filter((x) => x.status === "done").map((x) => x.id) } };
}
function goOnline() {
  if (S.net.online) return;
  S.net.online = true; S.net.syncing = true; S.net.total = S.outbox.length;
  const token = S;
  const step = () => {
    if (S !== token) return;
    const it = S.outbox.shift();
    if (it) { try { if (it.fn) it.fn(); } catch (e) { console.error(e); } }
    if (S.outbox.length) { setTimeout(step, S.outbox[0].kind === "photo" ? 700 : 220); }
    else { const n = S.net.total; S.net.syncing = false; S.net.snap = null; S.net.total = 0; toast(t("t_synced", { n })); }
    render();
  };
  if (S.outbox.length) setTimeout(step, 600); else { S.net.syncing = false; S.net.snap = null; }
}
function netChip() {
  const n = S.outbox.length;
  if (!S.net.online) return `<button class="netchip off" data-act="outbox">${I.wifiOff}${t("netOff", { n })}</button>`;
  if (S.net.syncing) return `<button class="netchip sync" data-act="outbox">${I.sync}${t("netSync", { n })}</button>`;
  return "";
}
function gpsWaiting() { return S.net.snap ? Math.max(0, S.dev.c2.trail.length - S.net.snap.trailLen) : 0; }
function doOutbox() {
  const photos = S.outbox.filter((x) => x.kind === "photo"), mb = photos.reduce((a, x) => a + x.size, 0).toFixed(1);
  const icon = (k) => (k === "photo" ? I.cam.replace('class="cam"', "") : k === "text" ? I.nav : I.cloud);
  const done = S.net.total - S.outbox.length;

    ${photos.length ? `<div class="chips" style="margin:0"><span class="chip">${t("obPhotos", { n: photos.length, mb })}</span>${gpsWaiting() ? `<span class="chip">${t("obGps", { n: gpsWaiting() })}</span>` : ""}</div>` : gpsWaiting() ? `<div class="chips" style="margin:0"><span class="chip">${t("obGps", { n: gpsWaiting() })}</span></div>` : ""}
    <div>${S.outbox.length ? S.outbox.map((x) => `<div class="obrow">${icon(x.kind)}<span>${esc(x.label)}</span><span class="tm">${x.at}</span></div>`).join("") : `<p class="muted">${t("obEmpty")}</p>`}</div>

function crewSummary() {

  const cur = curStop();

function custData() {
  const k = S.finKind, d = finData();
  const avgRate = Object.values(S.rates).reduce((a, b) => a + b, 0) / Object.keys(S.rates).length;
  const visitsFor = (vpw) => (k === "day" ? (vpw >= 1 ? 1 : 0) : k === "week" ? Math.max(vpw >= 0.5 ? 1 : 0, Math.round(vpw)) : k === "month" ? Math.round(vpw * 4.3) : Math.round(vpw * 30));
  const list = CUSTS.map(([n, addr, area, crew, plan, vpw, price, on, dr, km, mat], i) => {
    const ppl = crew === "c3" ? 3 : 2, mow = S.mowers.filter((m) => m.crew === crew), lph = mow.length ? Math.max(...mow.map((m) => m.lph)) : 0;
    const labour = ((on + dr) / 60) * ppl * avgRate, fuel = (km * S.trucks[crew].l100) / 100 * S.price + (on / 60) * lph * S.price * 0.7;
    const maint = km * S.maintKm + (on / 60) * S.maintMowerH, cost = labour + fuel + maint + mat;
    const v = visitsFor(vpw);
    return { i, n, addr, area, crew, plan, price, on, dr, km, v, rev: v * price, cost: v * cost, perVisitCost: cost, labour: v * labour, fuel: v * fuel, maint: v * maint, mat: v * mat, onMin: v * on, drMin: v * dr };
  });
  const totRev = list.reduce((a, c) => a + c.rev, 0);
  // fixed costs follow the revenue share of the whole business, so a $2,000 customer carries 10× the share of a $200 one
  const fixRate = d.revenue ? d.fixedIn / d.revenue : 0;
  list.forEach((c) => { c.profit = c.rev - c.cost; c.fix = c.rev * fixRate; c.net = c.profit - c.fix; c.perH = c.onMin ? (c.net / c.onMin) * 60 : 0; });
  const avgH = list.reduce((a, c) => a + c.net, 0) / Math.max(1, list.reduce((a, c) => a + c.onMin, 0)) * 60;
  return { list, totRev, avgH, fixRate };
}

function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { row.push(cur); cur = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.some((x) => x.trim())) rows.push(row); row = []; } else cur += ch;
  }
  row.push(cur); if (row.some((x) => x.trim())) rows.push(row);
  return rows;
}

// GPS drives the finance-only crew flow: leave a stop, arrive at the next, stay, leave.
function slimTick() {
  const d = S.dev.c2;
  if (S.mode !== "finance" || S.shift !== "on" || !S.clockedIn || S.pause || !d.on) return;
  const c = curStop();
  if (d.queue.length) { S.simMin += 1; return; }
  if (!c) { if (!d.home && Math.hypot(d.pos.x - YARD.x, d.pos.y - YARD.y) > 8) { d.queue = sample(d.pos, legWay(d.pos, YARD)); d.home = true; } return; }
  if (c.status === "onsite") {
    S.simMin += 3;
    if (--S.dwell <= 0) {
      c.status = "done"; c.mins = S.simMin - c.simArr;
      office(t("lb_done", { a: c.addr }));
      nextStop(); const n = curStop();
      if (n) { S.legStart = { from: c.addr, km: d.km, driveS: d.driveS, min: S.simMin }; n.status = "enroute"; d.queue = sample(d.pos, legWay(d.pos, n)); }
      if (S.view === "crew" && !$("#layer").innerHTML) render();
    }
    return;
  }
  if (c.status === "todo") { S.legStart = { from: S.legStart ? S.legStart.from : t("yard"), km: d.km, driveS: d.driveS, min: S.simMin }; c.status = "enroute"; d.queue = sample(d.pos, legWay(d.pos, c)); }
}
function slimArrive(d) {
  const c = curStop(); if (!c || c.status !== "enroute" || Math.hypot(c.x - d.pos.x, c.y - d.pos.y) > 8) return;
  const L0 = S.legStart || { from: t("yard"), km: 0, driveS: 0, min: 0 };
  S.legs.push({ id: c.id, from: L0.from, to: c.addr, left: simClock(L0.min), arr: simClock(S.simMin), min: Math.round((d.driveS - L0.driveS) / 60), km: d.km - L0.km });
  c.status = "onsite"; c.arrived = now(); c.simArr = S.simMin; S.gpsAt[c.id] = fmtT(simClock(S.simMin));
  S.dwell = Math.max(3, Math.round((c.est * (0.85 + Math.random() * 0.35)) / 3));

}

  const crews = [["c2", 1720, 8.6, 9, 4, 2, 0], ["c1", 1600, 8.5, 8, 3, 2, 1], ["c4", 1400, 8.1, 8, 2, 1, 0], ["c3", 1180, 8.9, 6, 2, 0, 1]];

    const mow = S.mowers.filter((m) => m.crew === id), mowFuel = mow.reduce((a, m) => a + m.h * m.lph, 0) * scale * S.price * drift;
    const km = (S.dev[id] ? 60 : 60) * scale, maint = km * S.maintKm + mow.reduce((a, m) => a + m.h, 0) * scale * S.maintMowerH;
    return { id, rev: r, labour, fuel: (km / 100) * S.trucks[id].l100 * S.price + mowFuel, mat: r * 0.07, truck: maint, jobs: Math.round(jobs * scale), mins: Math.round(h * 0.78 * 60), lc: Math.round(lc * wk), lw: Math.round(lw * wk), comp: Math.round(comp * wk) };
  });

  const revenue = sum((r) => r.rev), labour = sum((r) => r.labour), fuel = sum((r) => r.fuel), mat = sum((r) => r.mat), truck = sum((r) => r.truck);
  rows.forEach((r) => (r.profit = r.rev - r.labour - r.fuel - r.mat - r.truck));
  const jobs = sum((r) => r.jobs), comp = sum((r) => r.comp);
  const days = k === "day" ? 1 : k === "week" ? 7 : k === "month" ? 30 : 244;
  const fixed = (fixedMonthly() * 12) / 365.25 * days, fixedIn = (fixed * S.fixPct) / 100;

}

function render() {
  document.querySelectorAll("[data-t]").forEach((el) => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-act="view"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.view));
  document.querySelectorAll('[data-act="lang"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.querySelectorAll('[data-act="net"]').forEach((b) => b.setAttribute("aria-pressed", (b.dataset.v === "on") === S.net.online));
  $("#crew").hidden = S.view !== "crew"; $("#crew-tabs").hidden = S.view !== "crew"; $("#owner").hidden = S.view === "crew";
  if (S.view === "crew") renderCrew(); else renderOwner();
}
document.addEventListener("input", (e) => {
  if (e.target.dataset && e.target.dataset.wi) { S.wi[e.target.dataset.wi] = +e.target.value; const v = $("#wiv-" + e.target.dataset.wi); if (v) v.textContent = (+e.target.value > 0 ? "+" : "") + e.target.value + "%"; const d = finData(); const tmp = document.createElement("div"); tmp.innerHTML = whatIfHtml(d); const o = $("#wi-out"); if (o) o.innerHTML = tmp.querySelector("#wi-out").innerHTML; const ph = $(".whatif"); if (ph && !ph.parentElement.querySelector('[data-act="wiReset"]')) { /* show Reset on next full render */ } return; }
  if (e.target.id === "fix-pct") { S.fixPct = +e.target.value; const o = $("#fix-out"); if (o) o.textContent = fixLabel(); return; }
  if (e.target.id === "cust-q") { S.custQ = e.target.value; const pos = e.target.selectionStart; renderOwner(); const q = $("#cust-q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} } return; }
  if (e.target.id === "co-q") { S.coQ = e.target.value; const r = $("#co-rows"); if (r) r.innerHTML = coRows(); return; }
  if (e.target.id === "prop-q") { S.propQ = e.target.value; const l = $("#prop-list"); if (l) l.innerHTML = propRows(); return; }
  if (e.target.id === "ns-note") { const s = curStop(); if (s) { (S.next[s.id] = S.next[s.id] || {}).note = e.target.value; updateGate(); } }
});
document.addEventListener("change", (e) => {
  const el = e.target, v = parseFloat(el.value);
  if (el.id === "fuel-price" && v > 0) { S.price = isMi() ? v / 3.78541 : v; renderOwner(); return; }
  if (el.id === "units") { S.units = el.value; renderOwner(); return; }
  if (el.id === "fix-pct") { renderOwner(); return; }
  if (el.dataset && el.dataset.rtday) { const R = S.rt, id = el.dataset.rtday, to = +el.value; if (to === R.day) return; rtPush(); const k = rtKey(R); R.orders[k] = R.orders[k].filter((x) => x !== id); R.orders["r|" + to + "|" + R.crew].push(id); R.stops[id].day = to; toast(t("rtMovedDay", { a: R.stops[id].addr, d: rtDayName(to) })); renderOwner(); return; }
  if (el.dataset && el.dataset.eqmower) { const m = S.mowers.find((x) => x.id === el.dataset.eqmower); if (m) m.crew = el.value || null; renderOwner(); return; }
  if (el.dataset && el.dataset.eqtruck) { const a = el.dataset.eqtruck, b2 = el.value; if (a !== b2) { [S.trucks[a], S.trucks[b2]] = [S.trucks[b2], S.trucks[a]]; [S.truckVal[a], S.truckVal[b2]] = [S.truckVal[b2], S.truckVal[a]]; } renderOwner(); return; }
  if (el.id === "mt-km") { S.maintKm = Math.max(0, +el.value || 0); toast(t("saved")); return; }
  if (el.id === "mt-h") { S.maintMowerH = Math.max(0, +el.value || 0); toast(t("saved")); return; }
  if (el.dataset && el.dataset.imp) { S.impMap[el.dataset.imp] = +el.value; renderOwner(); return; }
  if (el.id === "imp-file" && el.files && el.files[0]) { const f = el.files[0]; f.text().then((txt) => { S.impRows = parseCsv(txt); S.impMap = null; S.impName = f.name; renderOwner(); }); return; }
  if (el.dataset && el.dataset.fs) {
    const L = S.fuelLoc, k = el.dataset.fs; L[k] = el.value;
    if (k === "country") { L.region = el.value === "CA" ? "ON" : el.value === "US" ? "NY" : ""; L.city = el.value === "CA" ? "Toronto" : ""; if (el.value === "OTHER") L.auto = false; }
    if (k === "region" && L.country === "CA") L.city = (CA_CITIES[el.value] || [])[0] || "";
    if (L.auto && L.country !== "OTHER") fuelCheck();
    renderOwner(); return;
  }
  if (el.dataset && el.dataset.wi) { renderOwner(); return; }
  if (el.id === "fs-auto") { S.fuelLoc.auto = el.checked; if (el.checked) fuelCheck(); renderOwner(); return; }
  if (el.classList && el.classList.contains("sendto") && el.value) { const j = S.jobs.find((x) => x.id === el.dataset.job); if (j) { doAssign(j, el.value); render(); } return; }
  if (el.dataset && el.dataset.rate && v >= 0) { S.rates[el.dataset.rate] = v; toast(t("saved")); return; }
  if (el.id === "ot-after" && v > 0) { S.otAfter = v; toast(t("saved")); return; }
  if (el.id === "ot-x" && v >= 1) { S.otx = v; toast(t("saved")); return; }
  if (el.id === "fin-target" && v > 0) { S.target = v; toast(t("saved")); return; }
  if (el.id === "er-w") { S.rep.weekly = el.checked; renderOwner(); return; }
  if (el.id === "er-m") { S.rep.monthly = el.checked; return; }
  if (el.id === "er-s") { S.rep.season = el.checked; return; }
  if (el.id === "er-day") { S.rep.day = +el.value; return; }
  if (el.id === "er-to") { S.rep.to = el.value; return; }
  if (el.id === "idle-min" && v >= 0) { S.idleMin = v; renderOwner(); return; }
  if (el.dataset && el.dataset.truck && v > 0) { S.trucks[el.dataset.truck].l100 = isMi() ? 235.215 / v : v; renderOwner(); return; }
  if (e.target.id === "ns-date") { const s = curStop(); if (s) { const nx = (S.next[s.id] = S.next[s.id] || {}); nx.date = e.target.value; nx.days = null; render(); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches && e.target.matches('.item[data-act="focusItem"]')) e.target.click(); });
// live ticks: GPS fixes, timers, map, team list
setInterval(() => {
  gpsTick();
  if ($("#layer").innerHTML) return;
  if (S.pause) { const pt = $("#pause-timer"); if (pt) pt.textContent = mmss(); const hp = $("#hdr-pause"); if (hp) hp.textContent = mmss(); }
  const tm = $("#site-timer"); const s = curStop();
  if (tm && s && s.arrived) tm.textContent = `${elapsedMin(s.arrived)} ${t("min")} / ${s.est}`;
  const gl = $("#gpsline"); if (gl && s) { const tmp = document.createElement("div"); tmp.innerHTML = gpsLine(s); if (tmp.firstChild) gl.replaceWith(tmp.firstChild); }
  const m = $("#mapsvg");
  if (m) { const tmp = document.createElement("div"); tmp.innerHTML = mapSVG({ crewOnly: S.view === "crew" }); m.replaceWith(tmp.firstChild); }
  const tr = $("#teamrows"); if (tr) tr.innerHTML = teamRows();
  const ft = $("#fueltoday"); if (ft) ft.innerHTML = fuelTodayTable();
  if (S.view === "crew" && S.mode === "finance") { const c = curStop(), ss = $("#slim-site"), sl = $("#slim-left"); if (ss && c && c.simArr != null) ss.textContent = t("slOnSite", { m: S.simMin - c.simArr }); if (sl) sl.textContent = t("slLeft", { d: fDist(S.dev.c2.queue.length * STEP * UNIT_M / 1000) }); }
}, 1000);
render();
})();
</script>
</body></html>
