VIEWS.pnl = () => {
  const months = [["Apr", 3], ["May", 4], ["Jun", 5], ["Jul", 6], ["Aug", 7], ["Sep", 8], ["Oct", 9], ["Nov*", 10]];
  const cols = months.map(([l, m]) => {
    const from = dayStr(new Date(Date.UTC(2026, m, m === 3 ? 6 : 1))), last = dayStr(new Date(Date.UTC(2026, m + 1, 0)));
    return { l, s: sum(from, last < TODAY ? last : TODAY) };
  });
  const season = sum(PERIODS.season.from, PERIODS.season.to);
  cols.push({ l: "Season", s: season, tot: true });
  const kind = (k) => (s) => s.vs.filter((v) => v.kind === k).reduce((a, v) => a + v.price, 0);
  const R = (label, f, cls = "") => `<tr class="${cls}"><td>${label}</td>${cols.map((c) => { const x = f(c.s); return `<td class="n ${x < 0 ? "neg" : ""} ${c.tot ? "strong" : ""}">${typeof x === "string" ? x : $(x)}</td>`; }).join("")}</tr>`;
  const fx = (s, f) => s.fixed * f.m / FIXED_M;
  const netAll = (s) => s.cm - s.fixed;
  COPY.pnl = () => csv([["", ...cols.map((c) => c.l)], ...[["Mowing", kind("Mow")], ["Cleanups", (s) => kind("Spring cleanup")(s) + kind("Fall cleanup")(s)], ["Fertilizer", kind("Fertilizer")], ["Revenue", (s) => s.rev],
    ["Crew pay", (s) => s.labour], ["Fuel", (s) => s.fuel], ["Maintenance", (s) => s.maint], ["Materials", (s) => s.mat], ["Contribution", (s) => s.cm],
    ...FIXED.map((f) => [f.n, (s) => fx(s, f)]), ["Net profit", netAll]].map(([l, f]) => [l, ...cols.map((c) => f(c.s).toFixed(2))])]);
  return `<section class="card"><div class="row between"><div><h2>Profit and loss, 2026 season</h2><p class="muted small">Every number below comes from your jobs, your crew rates and your bills. * November to date.</p></div><button class="btn" data-copy="pnl">Copy as CSV</button></div>
  <div class="tablewrap"><table><thead><tr><th></th>${cols.map((c) => `<th class="n">${c.l}</th>`).join("")}</tr></thead><tbody>
    ${R("Mowing", kind("Mow"), "sub")}${R("Cleanups", (s) => kind("Spring cleanup")(s) + kind("Fall cleanup")(s), "sub")}${R("Fertilizer", kind("Fertilizer"), "sub")}
    ${R("<b>Revenue</b>", (s) => s.rev)}
    ${R("Crew pay: on site", (s) => -s.labSite, "sub")}${R("Crew pay: driving", (s) => -s.labDrive, "sub")}${R("Crew pay: loading, shop", (s) => -s.labOther, "sub")}
    ${R("Fuel (trucks and mowers)", (s) => -s.fuel, "sub")}${R("Maintenance", (s) => -s.maint, "sub")}${R("Materials", (s) => -s.mat, "sub")}
    ${R("<b>Contribution</b> (profit from jobs)", (s) => s.cm, "total")}
    ${R("Contribution margin", (s) => pct(s.cm / (s.rev || 1)), "sub")}
    ${FIXED.map((f) => R(f.n, (s) => -fx(s, f), "sub")).join("")}
    ${R("<b>Net profit</b>", netAll, "total")}
    ${R("Net margin", (s) => pct(netAll(s) / (s.rev || 1)), "sub")}
  </tbody></table></div>
  <p class="explain">Contribution is what the jobs leave after their own costs. Fixed costs are spread by days, so a month carries its share whether the crews worked or not. Depreciation isn't cash going out, but trucks and mowers do wear out and need replacing.</p></section>
  <section class="card"><h2>Net profit by month</h2>${bars(cols.slice(0, -1).map((c) => netAll(c.s)), cols.slice(0, -1).map((c) => c.l), { fmt: kfmt, color: "var(--c-kept)" })}</section>`;
};

VIEWS.rates = () => {
  if (!S.rates) S.rates = CREWS.map((c) => ({ w: c.people.map((p) => p[1]), burden: c.burden * 100 }));
  const season = sum(PERIODS.season.from, PERIODS.season.to);
  const crewHoursPaid = (season.site + season.drive + season.other) / 60;
  const yearFixed = FIXED_M * 12;
  const ohPerHour = yearFixed / crewHoursPaid * (31 / 34); // a full season ≈ 34 weeks of work
  const fuelMaintPerHour = (season.fuel + season.maint) / crewHoursPaid;
  const siteShare = season.site / (season.site + season.drive + season.other);
  const actual = season.rev / (season.site / 60);
  const out = CREWS.map((cr, i) => {
    const r = S.rates[i];
    const pay = r.w.reduce((a, b) => a + b, 0) * (1 + r.burden / 100);
    const costPaidHour = pay + fuelMaintPerHour + ohPerHour;
    const costSiteHour = costPaidHour / siteShare;
    const need = costSiteHour / (1 - S.margin / 100);
    const s = sum(PERIODS.season.from, PERIODS.season.to, (v) => v.crew === i);
    return { cr, r, pay, costPaidHour, costSiteHour, need, actual: s.rev / (s.site / 60) };
  });
  return `<section class="card" data-static="mg"><h2>What a crew-hour really costs</h2>
    <p class="explain">Most owners price from the wage. The real cost of an hour on a lawn includes payroll costs, fuel, wear, every fixed bill, and the hours spent driving and loading that nobody pays for. Change the numbers to match yours.</p>
    <div class="range" style="max-width:420px"><div class="row"><label for="mg">Profit you want to keep</label><span class="num" data-live>${S.margin}%</span></div><input type="range" id="mg" min="0" max="40" step="1" value="${S.margin}"></div>
  </section>
  <div class="grid2">${out.map((o, i) => `<section class="card"><h3>${o.cr.name}</h3>
    <div class="row">${o.cr.people.map((p, j) => `<label class="f">${p[0]}, $/h<input type="number" min="0" step="0.5" data-w="${i}-${j}" value="${o.r.w[j]}"></label>`).join("")}
      <label class="f">Payroll costs %<input type="number" min="0" step="1" data-b="${i}" value="${o.r.burden}"></label></div>
    <div class="steps">
      <div><span>Wages + payroll costs (CPP, EI, WSIB, vacation)</span><span>${$(o.pay, 2)}</span></div>
      <div><span>Fuel and maintenance per paid hour</span><span>${$(fuelMaintPerHour, 2)}</span></div>
      <div><span>Fixed costs per paid crew-hour (${$(yearFixed)} a year)</span><span>${$(ohPerHour, 2)}</span></div>
      <div><span><b>Cost of a paid crew-hour</b></span><span><b>${$(o.costPaidHour, 2)}</b></span></div>
      <div><span>Only ${pct(siteShare)} of paid time is on a lawn, so an hour on site costs</span><span>${$(o.costSiteHour, 2)}</span></div>
      <div class="res"><span>Charge at least, per crew-hour on site</span><span>${$(o.need, 2)}</span></div>
    </div>
    <p class="small">You're charging <b class="${o.actual < o.need ? "neg" : "pos"}">${$(o.actual, 2)}</b> an hour on site on average this season${o.actual < o.need ? `, ${$(o.need - o.actual, 2)} under target. On a 30-minute lawn that's ${$((o.need - o.actual) / 2)} a visit.` : ". You're above target."}</p>
  </section>`).join("")}</div>
  <section class="card"><h3>Quick price for a new lawn</h3>
    <div class="row"><label class="f">Minutes on site<input type="number" id="qm" min="5" step="5" value="30"></label><label class="f">Minutes driving to it<input type="number" id="qd" min="0" step="1" value="8"></label><label class="f">Crew<select id="qc">${CREWS.map((c, i) => `<option value="${i}">${c.name}</option>`).join("")}</select></label></div>
    <p class="lead" id="qout"></p></section>`;
};
BIND.rates = (v) => {
  const rerender = () => { const y = scrollY; render(); scrollTo(0, y); };
  v.querySelector("#mg").oninput = (e) => { S.margin = +e.target.value; update(); };
  v.querySelectorAll("[data-w]").forEach((x) => (x.onchange = () => { const [i, j] = x.dataset.w.split("-").map(Number); S.rates[i].w[j] = Math.max(0, +x.value || 0); rerender(); }));
  v.querySelectorAll("[data-b]").forEach((x) => (x.onchange = () => { S.rates[+x.dataset.b].burden = Math.max(0, +x.value || 0); rerender(); }));
  const q = () => {
    const season = sum(PERIODS.season.from, PERIODS.season.to);
    const paidH = (season.site + season.drive + season.other) / 60;
    const i = +v.querySelector("#qc").value, r = S.rates[i];
    const pay = r.w.reduce((a, b) => a + b, 0) * (1 + r.burden / 100);
    const perPaidH = pay + (season.fuel + season.maint) / paidH + FIXED_M * 12 / paidH * (31 / 34);
    const m = +v.querySelector("#qm").value || 0, d = +v.querySelector("#qd").value || 0;
    const other = (m + d) * (season.other / (season.site + season.drive));
    const cost = perPaidH * (m + d + other) / 60;
    const price = Math.ceil(cost / (1 - S.margin / 100) / 5) * 5;
    v.querySelector("#qout").innerHTML = `Quote <b>${$(price)}</b> a visit. It costs you ${$(cost, 2)} with every bill included, so you keep ${$(price - cost, 2)}.`;
  };
  v.querySelectorAll("#qm,#qd,#qc").forEach((x) => (x.oninput = q));
  q();
};

VIEWS.breakeven = () => {
  const yearFixed = FIXED_M * 12;
  const labels = [], cum = [];
  let c = 0, crossI = -1;
  for (let w = 0; w < WEEKS; w++) {
    const f = dayStr(addDays(SEASON_START, w * 7)), t = dayStr(addDays(SEASON_START, w * 7 + 6));
    c += sum(f, t).cm; labels.push(fmtDay(f)); cum.push(c);
    if (crossI < 0 && c >= yearFixed) crossI = w;
  }
  const season = sum(PERIODS.season.from, PERIODS.season.to);
  const cmPct = season.cm / season.rev;
  const beRev = yearFixed / cmPct;
  const avgMow = season.vs.filter((v) => v.kind === "Mow");
  const cmPerMow = avgMow.reduce((a, v) => a + v.cm, 0) / avgMow.length;
  const mowsNeeded = yearFixed / cmPerMow;
  return `<div class="grid3">
    <div class="tile"><span class="k">Fixed costs for the year</span><span class="v">${$(yearFixed)}</span><span class="small muted">${$(FIXED_M)} a month, all 12 months</span></div>
    <div class="tile"><span class="k">Jobs keep, per $100</span><span class="v">${$(cmPct * 100)}</span><span class="small muted">after crew, fuel, wear, materials</span></div>
    <div class="tile"><span class="k">Revenue to break even</span><span class="v">${$(beRev)}</span><span class="small muted">for the year</span></div>
  </div>
  <section class="card"><h2>When did this year start making money?</h2>
    ${lines([{ vals: cum, color: "var(--c-kept)", area: true }], labels, { fmt: kfmt, ref: yearFixed, refLabel: "a full year of fixed costs", marks: crossI >= 0 ? [{ i: crossI, v: cum[crossI], color: "var(--c-kept)", label: "broke even " + labels[crossI] }] : [] })}
    <p class="explain">The green line is profit from jobs, added up week by week. Until it crosses the red line, the season is still paying off a year of rent, insurance, software and equipment. ${crossI >= 0 ? `This year it crossed in the week of ${labels[crossI]}; everything after that is real profit.` : `It hasn't crossed yet.`}</p></section>
  <section class="card"><h2>In mows</h2>
    <div class="steps">
      <div><span>Average a mow leaves after its own costs</span><span>${$(cmPerMow, 2)}</span></div>
      <div><span>Mows a year just to pay fixed costs</span><span>${Math.ceil(mowsNeeded).toLocaleString()}</span></div>
      <div><span>That's per week, over 27 mowing weeks</span><span>${Math.ceil(mowsNeeded / 27)}</span></div>
      <div class="res"><span>You mow per week</span><span>${Math.round(avgMow.length / 27)}</span></div></div>
    <p class="explain">Every weekly customer above the break-even line adds about ${$(cmPerMow * 27)} a season to your profit. Every one below it is helping pay the rent.</p></section>`;
};

VIEWS.pricing = () => {
  const { rows, avg } = customerRows(PERIODS.season.from, PERIODS.season.to);
  const mowRows = rows.filter((r) => r.vs.some((v) => v.kind === "Mow"));
  const target = S.raiseWho === "all" ? mowRows : mowRows.filter((r) => r.status !== "good");
  const lostN = Math.round(target.length * S.lose / 100);
  const lost = target.slice().sort((a, b) => a.perHour - b.perHour).slice(0, lostN); // assume the worst-earning ones leave first
  const lostSet = new Set(lost.map((r) => r.c.id));
  const mowWeeks = 27;
  let gain = 0, lostCm = 0, freedMin = 0;
  for (const r of target) {
    const mows = r.vs.filter((v) => v.kind === "Mow");
    if (lostSet.has(r.c.id)) { lostCm += mows.reduce((a, v) => a + v.cm, 0); freedMin += mows.reduce((a, v) => a + v.site + v.drive, 0); }
    else gain += r.c.price * S.raise / 100 * mows.length;
  }
  const change = gain - lostCm;
  const freedH = freedMin / 60 / mowWeeks;
  return `<section class="card" data-static="price"><h2>Price planner</h2>
    <p class="explain">Try a price increase before you send the letters. It assumes the customers who leave are the ones earning you the least, which is usually what happens.</p>
    <div class="grid3">
      <div class="range"><div class="row"><label for="rr">Raise prices by</label><span class="num" data-live>${S.raise}%</span></div><input type="range" id="rr" min="0" max="25" step="1" value="${S.raise}"></div>
      <div class="range"><div class="row"><label for="rl">Customers who might leave</label><span class="num" data-live>${S.lose}%</span></div><input type="range" id="rl" min="0" max="30" step="1" value="${S.lose}"></div>
      <div><span class="small"><b>Who gets the raise</b></span><div class="seg" role="group" aria-label="Who gets the raise"><button data-who="low" aria-pressed="${S.raiseWho === "low"}">Thin and losing (${mowRows.filter((r) => r.status !== "good").length})</button><button data-who="all" aria-pressed="${S.raiseWho === "all"}">Everyone (${mowRows.length})</button></div></div>
    </div></section>
  <section class="hero">
    <div class="tile big"><span class="k">Change in profit, a full season</span><span class="v ${change < 0 ? "neg" : ""}">${change >= 0 ? "+" : ""}${$(change)}</span></div>
    <div class="tile"><span class="k">From higher prices</span><span class="v pos">+${$(gain)}</span><span class="small muted">${target.length - lostN} customers</span></div>
    <div class="tile"><span class="k">Lost with leavers</span><span class="v neg">−${$(lostCm)}</span><span class="small muted">${lostN} customers</span></div>
    <div class="tile"><span class="k">Crew time freed</span><span class="v">${freedH.toFixed(1)} h</span><span class="small muted">a week, to fill with better work</span></div>
  </section>
  <section class="card"><h2>Who gets a letter</h2>
    <div class="tablewrap"><table><thead><tr><th>Customer</th><th class="n">Per hour now</th><th class="n">Now</th><th class="n">New price</th><th class="n">Suggested</th><th></th></tr></thead><tbody>
    ${target.slice().sort((a, b) => a.perHour - b.perHour).map((r) => `<tr class="click ${lostSet.has(r.c.id) ? "hl" : ""}" tabindex="0" data-cust="${r.c.id}"><td><div class="who">${esc(r.c.name)}</div><div class="where">${esc(r.c.addr)} · ${r.c.area}</div></td><td class="n">${$(r.perHour)}</td><td class="n">${$(r.c.price)}</td><td class="n"><b>${$(round5(r.c.price * (1 + S.raise / 100)))}</b></td><td class="n">${r.suggest && r.suggest > r.c.price ? $(r.suggest) : "–"}</td><td>${lostSet.has(r.c.id) ? `<span class="chip thin">Might leave</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="explain">New prices are rounded to $5. "Suggested" is the price that brings a lawn to your average of ${$(avg)} an hour on site.</p></section>`;
};
BIND.pricing = (v) => {
  const re = (id) => { const y = scrollY; render(); scrollTo(0, y); document.getElementById(id)?.focus(); };
  v.querySelector("#rr").oninput = (e) => { S.raise = +e.target.value; update(); };
  v.querySelector("#rl").oninput = (e) => { S.lose = +e.target.value; update(); };
  v.querySelectorAll("[data-who]").forEach((b) => (b.onclick = () => { S.raiseWho = b.dataset.who; re(); }));
};

VIEWS.driving = () => {
  const P = PERIODS[S.period];
  const s = sum(P.from, P.to);
  const areas = AREAS.map((A) => {
    const a = sum(P.from, P.to, (v) => CUST[v.c].area === A.n);
    const fuelDrive = a.km * CREWS[A.crew].l100 / 100 * 1.47;
    const getThere = a.labDrive + fuelDrive + a.km * MAINT_KM;
    return { A, a, getThere, perVisit: getThere / (a.n || 1), share: getThere / (a.rev || 1) };
  }).sort((x, y) => y.share - x.share);
  const fl = FUEL.map((_, w) => fmtDay(dayStr(addDays(SEASON_START, w * 7))));
  // GPS vs odometer, last five work days, per crew
  const odo = [];
  for (let d = 0; d < 5; d++) for (const cr of CREWS) {
    const date = dayStr(addDays(new Date(Date.UTC(2026, 10, 2)), d));
    const vs = VISITS.filter((v) => v.date === date && v.crew === cr.id);
    if (!vs.length) continue;
    const gps = vs.reduce((a, v) => a + v.km, 0) + 9.5; // + yard and fuel stop
    const extra = cr.id === 1 && d === 3 ? 21 : (rnd() - 0.4) * 2.4;
    odo.push({ date, cr, gps, odo: Math.round(gps + extra) });
  }
  return `${periodBar()}
  <div class="grid3">
    <div class="tile"><span class="k">Driving</span><span class="v">${hm(s.drive)}</span><span class="small muted">${pct(s.drive / (s.site + s.drive + s.other))} of paid time</span></div>
    <div class="tile"><span class="k">Kilometres</span><span class="v">${Math.round(s.km).toLocaleString()}</span><span class="small muted">from GPS, stop to stop</span></div>
    <div class="tile"><span class="k">Cost of getting there</span><span class="v">${$(s.labDrive + s.km * (19.5 / 100 * 1.47 + MAINT_KM))}</span><span class="small muted">crew pay + fuel + wear while driving</span></div>
  </div>
  <section class="card"><h2>Cost of getting there, by area</h2>
    <div class="tablewrap"><table><thead><tr><th>Area</th><th class="n">Visits</th><th class="n">Drive / visit</th><th class="n">Km</th><th class="n">Getting there / visit</th><th class="n">Share of price</th></tr></thead><tbody>
    ${areas.map((x) => `<tr><td><div class="who">${x.A.n}</div><div class="where">${CREWS[x.A.crew].name}</div></td><td class="n">${x.a.n}</td><td class="n">${(x.a.drive / (x.a.n || 1)).toFixed(1)} min</td><td class="n">${Math.round(x.a.km).toLocaleString()}</td><td class="n"><b>${$(x.perVisit, 2)}</b></td><td class="n"><span class="chip ${x.share > 0.15 ? "bad" : x.share > 0.08 ? "thin" : "good"}">${pct(x.share)}</span></td></tr>`).join("")}
    </tbody></table></div>
    <p class="explain">Getting there = crew pay while driving + truck fuel + maintenance per km. ${areas[0].A.n} costs ${$(areas[0].perVisit, 2)} a visit before anyone starts a mower: charge a travel fee, fill the street with more customers, or hand it to a closer crew.</p></section>
  <div class="grid2">
    <section class="card"><h2>Fuel price, regular, $/L</h2>
      ${lines([{ vals: FUEL, color: "var(--c-fuel)" }], fl, { fmt: (n) => "$" + n.toFixed(2), h: 180, half: true })}
      <p class="explain">Weekly area average, looked up automatically (Statistics Canada for Canadian cities, the EIA for U.S. states). Crews' fuel receipts replace it when you have them.</p></section>
    <section class="card"><h2>GPS against the odometer</h2>
      <div class="tablewrap"><table><thead><tr><th>Day</th><th>Truck</th><th class="n">GPS km</th><th class="n">Odometer km</th><th class="n">Gap</th></tr></thead><tbody>
      ${odo.map((o) => { const gap = (o.odo - o.gps) / o.odo; return `<tr><td>${fmtDay(o.date, { weekday: "short", day: "numeric" })}</td><td>${o.cr.truck}</td><td class="n">${o.gps.toFixed(1)}</td><td class="n">${o.odo}</td><td class="n">${Math.abs(gap) > 0.1 ? `<span class="chip bad">+${pct(gap)}</span>` : pct(gap)}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="explain">The odometer is typed at the start and end of the day. A gap over 10% means the truck went somewhere the tablet didn't: worth a quiet question.</p></section>
  </div>`;
};

VIEWS.sources = () => `
  <section class="card"><div class="row between"><div><h2>Connected to Jobber</h2><p class="muted small">Sample connection · last sync 4 minutes ago</p></div><span class="chip good">Connected</span></div>
    <div class="grid3">
      <div class="tile"><span class="k">From your CRM</span><span class="v">${CUST.length}</span><span class="small muted">clients and properties</span></div>
      <div class="tile"><span class="k">Visits</span><span class="v">${VISITS.length.toLocaleString()}</span><span class="small muted">completed this season</span></div>
      <div class="tile"><span class="k">Invoices</span><span class="v">${AR.length}</span><span class="small muted">unpaid, with ages</span></div>
    </div>
    <p class="explain">Other ways in: Yardbook and other tools through Zapier, or a spreadsheet export from anything. Nothing changes in your CRM: you keep quoting, scheduling and invoicing there.</p></section>
  <section class="card"><h2>What each side does</h2>
    <div class="cmp">
      <div><b>Your CRM keeps</b><ul><li>Clients, properties, quotes</li><li>Schedule and visits</li><li>Invoices and payments</li><li>Messages to customers</li></ul></div>
      <div><b>Cutting Cost adds</b><ul>
        <li>The real cost of every visit: crew time on site, driving and loading</li>
        <li>Fixed bills and equipment wear shared across jobs, with a slider for true profit</li>
        <li>Profit per hour by customer, area and crew, and what to charge</li>
        <li>Fuel and kilometres from the crew tablet's GPS, checked against the odometer</li>
        <li>True hourly cost, break-even, price planner and winter cash</li></ul></div>
    </div>
    <p class="explain">The crew side stays tiny: sign in, keep location on, type the odometer morning and night. Arrivals and departures record themselves.</p></section>
  <section class="card"><h2>What it uses from you, once</h2>
    <div class="tablewrap"><table><thead><tr><th>Setting</th><th>Sample value</th><th>Used for</th></tr></thead><tbody>
      ${CREWS.map((c) => `<tr><td>${c.name} pay</td><td>${c.people.map((p) => `${p[0]} $${p[1]}/h`).join(", ")} + ${c.burden * 100}% payroll costs</td><td>Crew pay per minute</td></tr>`).join("")}
      <tr><td>Trucks</td><td>${CREWS.map((c) => `${c.truck} ${c.l100} L/100 km`).join(", ")}</td><td>Fuel per km</td></tr>
      <tr><td>Mowers</td><td>${MOWER.lph} L/h, running ${pct(MOWER.use)} of time on site</td><td>Mower fuel and wear</td></tr>
      <tr><td>Maintenance</td><td>$${MAINT_KM.toFixed(2)}/km, $${MOWER.maintHr.toFixed(2)}/mower hour</td><td>Wear and tear</td></tr>
      <tr><td>Fixed bills</td><td>${FIXED.length} lines, ${$(FIXED_M)} a month</td><td>True profit, break-even, cash</td></tr>
      <tr><td>Season</td><td>April to November</td><td>Season view and winter plan</td></tr>
    </tbody></table></div></section>`;

render();
</script>
</body></html>
