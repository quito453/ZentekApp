<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style>
<title>Cutting Cost Snow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a work-truck dashboard. Dark cab bar on top, light shop-floor cards below; simple tabs first, "Go deeper" tabs behind a switch. */
:root {
  --bg: #eceff3; --surface: #ffffff; --sunken: #e3e7ec; --line: #cfd5dc;
  --ink: #141b24; --muted: #56606c; --brand: #1c2733; --brand-ink: #f3f5f7;
  --accent: #ffc414; --accent-ink: #1c2733; --accent-soft: #fff3cc; --focus: #1f5fbf;
  --pos: #18794e; --pos-soft: #dcf1e5; --neg: #c0362c; --neg-soft: #fbe2df; --warn: #a15c00; --warn-soft: #fdecc8;
  --c-labour: #2f5d8a; --c-fuel: #d9622b; --c-maint: #2a8c82; --c-mat: #7b5ea7; --c-fixed: #9aa3ad; --c-kept: #18794e;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151b; --surface: #19212a; --sunken: #222c37; --line: #33404d;
  --ink: #e9edf1; --muted: #9aa6b2; --brand: #0b1016; --brand-ink: #f3f5f7;
  --accent: #ffcc29; --accent-ink: #141b24; --accent-soft: #3a3214; --focus: #6aa3ff;
  --pos: #4cc38a; --pos-soft: #173a29; --neg: #ff7a6e; --neg-soft: #44201d; --warn: #f0b03c; --warn-soft: #3d2f12;
  --c-labour: #6e9fd0; --c-fuel: #f08a55; --c-maint: #4fbfb3; --c-mat: #a88bd6; --c-fixed: #6c7783; --c-kept: #4cc38a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --sunken: #222c37; --line: #33404d;
  --ink: #e9edf1; --muted: #9aa6b2; --brand: #0b1016; --brand-ink: #f3f5f7;
  --accent: #ffcc29; --accent-ink: #141b24; --accent-soft: #3a3214; --focus: #6aa3ff;
  --pos: #4cc38a; --pos-soft: #173a29; --neg: #ff7a6e; --neg-soft: #44201d; --warn: #f0b03c; --warn-soft: #3d2f12;
  --c-labour: #6e9fd0; --c-fuel: #f08a55; --c-maint: #4fbfb3; --c-mat: #a88bd6; --c-fixed: #6c7783; --c-kept: #4cc38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warnc { color: var(--warn); }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.cab { background: var(--brand); color: var(--brand-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.cab .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.logo { font: 700 1.35rem/1 var(--font-display); letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 6px; }
.logo b { background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 3px; }
.logo small { font: 500 0.8rem var(--font); opacity: 0.75; }
.sample { font-size: 0.78rem; border: 1px solid rgb(255 255 255 / 0.3); border-radius: 99px; padding: 2px 10px; opacity: 0.85; }
.spacer { flex: 1; }
.modesw { display: inline-flex; background: rgb(255 255 255 / 0.1); border-radius: var(--r); padding: 3px; }
.modesw button { border: 0; background: none; color: var(--brand-ink); padding: 6px 12px; border-radius: 4px; font-weight: 600; min-height: 36px; }
.modesw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 12px 12px 10px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a.deep::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-labour); }
nav.tabs .sep { width: 1px; background: var(--line); margin: 10px 6px; flex: none; }

main.wrap { padding-block: 18px 48px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.tile.big .muted { color: rgb(243 245 247 / 0.7); }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.seg { display: inline-flex; background: var(--sunken); border-radius: var(--r); padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 4px; font-weight: 600; min-height: 38px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }
.btn { border: 1.5px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: var(--r); font-weight: 600; min-height: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:hover { border-color: var(--ink); }

.lead { font: 600 clamp(1.15rem, 2.4vw, 1.5rem)/1.3 var(--font-display); max-width: 46ch; }
.hero { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr 1fr; } .hero .big { grid-column: 1 / -1; } }
.tile { background: var(--sunken); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.tile .k { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.tile .v { font: 700 1.55rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile.big { background: var(--brand); color: var(--brand-ink); }
.tile.big .k { color: rgb(243 245 247 / 0.7); }
.tile.big .v { font-size: 2.6rem; }
.delta { font-size: 0.82rem; font-weight: 600; }

.fixbar { display: grid; gap: 6px; border-left: 4px solid var(--accent); }
.fixbar input[type=range] { width: 100%; accent-color: var(--brand); min-height: 32px; }
:root[data-theme="dark"] .fixbar input[type=range] { accent-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fixbar input[type=range] { accent-color: var(--accent); } }
.ticks { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }

.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r); background: var(--sunken); }
.alert .dot { width: 10px; height: 10px; border-radius: 50%; }
.alert.bad .dot { background: var(--neg); } .alert.warn .dot { background: var(--warn); } .alert.good .dot { background: var(--pos); }
.alert a { font-weight: 600; color: var(--ink); white-space: nowrap; }

.stack100 { display: flex; height: 26px; border-radius: 4px; overflow: hidden; }
.stack100 span { display: block; min-width: 2px; }
.legend { display: grid; gap: 4px; }
.legend div { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.legend div:last-child { border-bottom: 0; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.legend .p { color: var(--muted); min-width: 3.5em; text-align: right; }

.chip { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.good { background: var(--pos-soft); color: var(--pos); }
.chip.thin { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--neg-soft); color: var(--neg); }
.chip.info { background: var(--sunken); color: var(--muted); }

.tablewrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; padding: 8px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunken); }
tr.sub td { color: var(--muted); }
tr.total td { font-weight: 700; border-top: 1.5px solid var(--ink); }
tr.hl td { background: var(--accent-soft); }
td .who { font-weight: 600; } td .where { font-size: 0.82rem; color: var(--muted); }
input[type=search], input[type=number], select { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 10px; min-height: 38px; }
input[type=number] { width: 7em; text-align: right; }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: 0.88rem; }
.range { display: grid; gap: 4px; }
.range .row { justify-content: space-between; font-weight: 600; }
.range input { width: 100%; accent-color: var(--c-labour); min-height: 30px; }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 11px var(--font); font-variant-numeric: tabular-nums; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .zero { stroke: var(--ink); stroke-width: 1; opacity: 0.4; }

.crewcard h3 { display: flex; align-items: center; gap: 8px; }
.crewcard h3 i { width: 12px; height: 12px; border-radius: 50%; }
.split3 { display: flex; height: 14px; border-radius: 3px; overflow: hidden; }
.steps { display: grid; gap: 0; }
.steps div { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.steps div.res { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; font-size: 1.05rem; }
.callout { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 12px 14px; }
.explain { font-size: 0.86rem; color: var(--muted); max-width: 72ch; }
details summary { cursor: pointer; font-weight: 600; }

.drawer-back { position: fixed; inset: 0; background: rgb(8 12 16 / 0.55); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { background: var(--bg); width: min(560px, 100%); height: 100%; overflow: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 16px; display: grid; gap: 14px; align-content: start; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cmp > div { padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.cmp > div:first-child { background: var(--sunken); }
.cmp ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
@media (max-width: 560px) { .cmp { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .card { animation: up 0.25s ease both; } @keyframes up { from { transform: translateY(4px); } } }
</style>
</head><body>
<style>
/* Snow additions: a cold blue for snowfall, salt grey-white */
:root { --c-snow: #3d7fc4; --c-salt: #8a7f6e; --c-ot: #b5442a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-snow: #7db4ec; --c-salt: #bdb3a2; --c-ot: #f08a6e; } }
:root[data-theme="dark"] { --c-snow: #7db4ec; --c-salt: #bdb3a2; --c-ot: #f08a6e; }

.tile.big .pos { color: #6fdba0; } .tile.big .neg { color: #ff8a7e; }
td.n.pos, td.n.neg, td.n.warnc { font-weight: 600; }
.cm { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--c-snow); }
.typechip { font-size: 0.74rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.storm-ice { color: var(--c-snow); font-weight: 600; font-size: 0.8rem; }

/* ── product shell: sidebar on wide screens, sync status, source tags, visual guides ── */
:root { --side: 224px; --cabh: 56px; --s-crm: #2f6fb5; --s-gps: #18794e; --s-you: #8a5a00; --s-pub: #6b4fa0; --s-calc: #56606c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s-crm: #7fb2ec; --s-gps: #5fd19a; --s-you: #f0b03c; --s-pub: #b79ae6; --s-calc: #9aa6b2; } }
:root[data-theme="dark"] { --s-crm: #7fb2ec; --s-gps: #5fd19a; --s-you: #f0b03c; --s-pub: #b79ae6; --s-calc: #9aa6b2; }
header.cab .wrap { min-height: var(--cabh); max-width: none; }
.who-am { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 0.85rem var(--font); }
.syncpill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; background: rgb(255 255 255 / 0.08); border-radius: 99px; padding: 4px 10px; border: 0; color: var(--brand-ink); }
.syncpill i, .sys i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgb(61 220 132 / 0.2); }
nav.tabs .navh { display: none; }
@media (min-width: 1100px) {
  nav.tabs { position: fixed; top: calc(var(--cabh) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: var(--side); border-bottom: 0; border-right: 1px solid var(--line); z-index: 4; }
  nav.tabs .wrap { flex-direction: column; gap: 2px; padding: 14px 10px; overflow-y: auto; height: 100%; max-width: none; }
  nav.tabs a { border-bottom: 0; border-left: 3px solid transparent; border-radius: 4px; padding: 9px 12px; }
  nav.tabs a[aria-current="page"] { background: var(--sunken); border-left-color: var(--accent); }
  nav.tabs a.deep::before { display: none; }
  nav.tabs .sep { display: none; }
  nav.tabs .navh { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 4px; }
  nav.tabs .navh:first-child { padding-top: 2px; }
  main.wrap { margin-left: var(--side); max-width: calc(1180px + var(--side)); padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  #view { margin-right: auto; max-width: 1180px; }
}

/* where the numbers come from */
.sources { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sources > span { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.sys { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; padding: 5px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.sys b { font-weight: 600; } .sys small { color: var(--muted); }
.sys.warn i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.src { display: inline-flex; gap: 4px; border: 0; background: none; padding: 0; margin-top: 4px; cursor: pointer; align-self: start; }
.srct { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; opacity: 0.9; white-space: nowrap; }
.srct.s-crm { color: var(--s-crm); } .srct.s-gps { color: var(--s-gps); } .srct.s-you { color: var(--s-you); } .srct.s-pub { color: var(--s-pub); } .srct.s-calc { color: var(--s-calc); }
.tile.big .srct { color: rgb(243 245 247 / 0.8); }
.src:hover .srct, .src:focus-visible .srct { background: var(--sunken); }
.srcrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srcrow:last-child { border-bottom: 0; }
.formula { font: 600 0.95rem/1.5 var(--font); background: var(--sunken); border-radius: var(--r); padding: 10px 12px; }

/* verdict: the one-glance answer */
.verdict { display: grid; gap: 10px; }
.verdict .word { display: inline-flex; align-items: center; gap: 8px; font: 700 1rem var(--font-display); padding: 3px 12px; border-radius: 99px; justify-self: start; }
.verdict .word.good { background: var(--pos-soft); color: var(--pos); } .verdict .word.thin { background: var(--warn-soft); color: var(--warn); } .verdict .word.bad { background: var(--neg-soft); color: var(--neg); }
.tile.big .verdict .word.good { background: rgb(76 195 138 / 0.18); color: #6fdba0; }
.tile.big .verdict .word.thin { background: rgb(240 176 60 / 0.18); color: #f5c26b; }
.tile.big .verdict .word.bad { background: rgb(255 122 110 / 0.18); color: #ff8a7e; }
.meter { position: relative; height: 12px; border-radius: 99px; background: rgb(127 127 127 / 0.25); }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.meter > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: currentColor; }
.meterlbl { display: flex; justify-content: space-between; font-size: 0.76rem; opacity: 0.8; }

/* money flow: in → costs → kept */
.flow { display: grid; gap: 6px; }
.flow .fr { display: grid; grid-template-columns: minmax(90px, 128px) 1fr auto; gap: 10px; align-items: center; font-size: 0.88rem; }
.flow .track { position: relative; height: 18px; }
.flow .track span { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 2px; }
.flow .fv { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4.5em; text-align: right; }
.flow .fr.in .fv, .flow .fr.kept .fv { color: var(--ink); font-weight: 700; }
.flow .fr.kept { border-top: 1px dashed var(--line); padding-top: 6px; }
details.nums summary { font-size: 0.86rem; color: var(--muted); }

/* in-table bars */
.mbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 140px; }
.mbar .t { position: relative; height: 8px; background: var(--sunken); border-radius: 99px; }
.mbar .t span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
.mbar .t b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.55; }
.mbar .v { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.6em; text-align: right; }
.alert .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; }
.alert.bad .ico { background: var(--neg-soft); color: var(--neg); } .alert.warn .ico { background: var(--warn-soft); color: var(--warn); } .alert.good .ico { background: var(--pos-soft); color: var(--pos); }
.alert { grid-template-columns: auto 1fr auto; }
.syssum { display: none; }
@media (max-width: 640px) { .sources .sys, .sources > span, .sources > a.small { display: none; } .syssum { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--ink); } .syssum i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; } }
main.wrap { grid-template-columns: minmax(0, 1fr); }
a.syncpill { text-decoration: none; }
@media (max-width: 640px) {
  header.cab .sample, .syncpill span.long { display: none; }
  .cab .wrap { gap: 8px; }
  .modesw button { padding: 6px 10px; }
}
.src { flex-wrap: wrap; max-width: 100%; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.meterlbl { gap: 6px; flex-wrap: wrap; }
td .who { min-width: 150px; }

<script>
// ───────────────────────── sample company ─────────────────────────
// Northline Snow & Ice: 72 sites, four routes, last winter (Nov 2025 – Apr 2026) had 22 snow and ice
// events, 208 cm in all, heavier than the 180 cm a normal winter brings. Everything comes from one seed.
let seed = 4021;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const round5 = (n) => Math.round(n / 5) * 5;
const round10 = (n) => Math.round(n / 10) * 10;
const NORMAL_CM = 180;
const W_FROM = "2025-11-01", W_TO = "2026-04-15";
const fmtDay = (s, o = { month: "short", day: "numeric" }) => new Date(s + "T12:00:00Z").toLocaleDateString("en-CA", { ...o, timeZone: "UTC" });

// Snow and ice events. ice = freezing rain or a flash freeze: salting only.
const EVENTS = [
  ["2025-11-19", 1, 1], ["2025-11-27", 9], ["2025-12-04", 6], ["2025-12-11", 14], ["2025-12-16", 2, 1], ["2025-12-22", 21], ["2025-12-28", 7],
  ["2026-01-03", 11], ["2026-01-09", 5], ["2026-01-14", 28], ["2026-01-20", 2, 1], ["2026-01-25", 8], ["2026-02-01", 16], ["2026-02-06", 4],
  ["2026-02-12", 33], ["2026-02-17", 6], ["2026-02-24", 3, 1], ["2026-03-03", 12], ["2026-03-10", 5], ["2026-03-18", 2, 1], ["2026-03-26", 10], ["2026-04-04", 3, 1],
].map(([date, cm, ice], i) => ({ i, date, cm, ice: !!ice, ec: ice ? 0 : Math.max(0, cm + [-1, 0, 1, -2, 2, 0, -1][i % 7]) }));
const TOTAL_CM = EVENTS.reduce((a, e) => a + e.cm, 0);

const ROUTES = [
  { id: 0, name: "Route R · driveways", short: "Route R", unit: "Truck 21 + 8 ft plow", people: [["Jake", 28], ["Ana (shovel)", 20]], lph: 9, wear: 14, color: "var(--c-labour)" },
  { id: 1, name: "Route C · commercial", short: "Route C", unit: "Truck 14 + 9 ft plow + salter", people: [["Marc", 32], ["Leo", 21]], lph: 11, wear: 20, color: "var(--c-fuel)" },
  { id: 2, name: "Route L · loader", short: "Route L", unit: "Wheel loader + pusher box", people: [["Pete", 36]], lph: 14, wear: 34, color: "var(--c-maint)" },
  { id: 3, name: "Route D · commercial", short: "Route D", unit: "Truck 9 + 9 ft plow + salter", people: [["Kevin", 30], ["Sam", 21]], lph: 11, wear: 20, color: "var(--c-mat)" },
];
const BURDEN = 0.19, OT_AFTER = 10, OT_X = 1.5, DIESEL = 1.62, SALT_T = 138, LOAD_H = 0.75;
const routeRate = (r) => ROUTES[r].people.reduce((a, p) => a + p[1], 0) * (1 + BURDEN);

const TYPES = {
  res: { n: "Driveway, seasonal", short: "Seasonal driveway" },
  com: { n: "Commercial, per push", short: "Per push" },
  big: { n: "Commercial, seasonal (salt included)", short: "Seasonal lot" },
  hr: { n: "Loader by the hour", short: "Hourly" },
};
const STREETS = ["Birchwood Dr", "Carling Ave", "Merivale Rd", "Fisher Ave", "Woodroffe Ave", "Baseline Rd", "Greenbank Rd", "Prince of Wales Dr", "Kirkwood Ave", "Clyde Ave"];
const SURN = "Tremblay Gagnon Roy Côté Bouchard Gauthier Morin Lavoie Fortin Gagné Ouellet Pelletier Bélanger Lévesque Bergeron Leblanc Paquette Girard Simard Boucher Caron Beaulieu Cloutier Dubé Poirier Fournier Lapointe Leclerc Lefebvre Poulin Thibault St-Pierre Nadeau Martin Landry Martel Bédard Grenier Lessard Bernier".split(" ");
const BIZ = ["Merivale Plaza", "Baseline Medical", "Carling Dental", "Fisher Heights Church", "Greenbank Self Storage", "Kirkwood Tire", "Clyde Industrial", "Woodroffe Vet Clinic", "Ridgeview Daycare", "Hampton Auto Body", "Westgate Pharmacy", "Copeland Office Park", "Pinecrest Bakery", "Iris Street Gym", "Queensway Motors", "Navaho Office Suites", "Elmvale Hardware", "Algonquin Physio"];
const BIG = ["Bayshore Towers Condo", "Lincoln Fields Shopping Centre", "Nepean Seniors Residence", "Westboro Station Condos", "Rideau Valley School Board lot", "Kanata North Business Park"];
const HR = ["Greenbelt Distribution", "Algonquin College lot P9", "Ottawa Truck Centre", "Bells Corners Plaza"];

const SITES = [];
for (let i = 0; i < 44; i++) {
  const big = rnd() < 0.2;
  const min = Math.round((big ? 9 : 5) + rnd() * 5);
  // Price was set years ago for most, so it doesn't follow the driveway size well.
  const fee = round10(480 + rnd() * 280 + (big ? 120 : 0));
  SITES.push({ type: "res", name: `${pick(SURN)}`, addr: `${Math.floor(10 + rnd() * 980)} ${pick(STREETS)}`, route: 0, trigger: 5, min, drive: Math.round(2 + rnd() * 3), fee, salt: rnd() < 0.3, saltFee: 150, saltT: 0.03 });
}
SITES.forEach((s, i) => { if (i === 7) { s.drive = 14; s.name += " (Manotick)"; } if (i === 19) { s.drive = 12; s.name += " (Richmond)"; } });
BIZ.forEach((n, i) => {
  const min = Math.round(12 + rnd() * 24);
  SITES.push({ type: "com", name: n, addr: `${Math.floor(100 + rnd() * 2900)} ${pick(STREETS)}`, route: i % 2 ? 3 : 1, trigger: 2.5, min, drive: Math.round(5 + rnd() * 8), push: round5(min * 4 + 35 + (rnd() - 0.5) * 40), saltApp: round5(70 + min * 4 + rnd() * 60), saltT: +(0.06 + min / 140).toFixed(2) });
});
BIG.forEach((n, i) => {
  const min = Math.round(40 + rnd() * 45);
  SITES.push({ type: "big", name: n, addr: `${Math.floor(100 + rnd() * 2900)} ${pick(STREETS)}`, route: i < 2 ? 1 : i < 4 ? 3 : 2, trigger: 2.5, min, drive: Math.round(6 + rnd() * 8), fee: round10(min * 200 + 1800 + rnd() * 3000), saltT: +(0.3 + min / 120).toFixed(2) });
});
HR.forEach((n) => {
  const min = Math.round(60 + rnd() * 70);
  SITES.push({ type: "hr", name: n, addr: `${Math.floor(100 + rnd() * 2900)} ${pick(STREETS)}`, route: 2, trigger: 5, min, drive: Math.round(8 + rnd() * 10), rate: 185, saltApp: round5(260 + rnd() * 200), saltT: +(0.5 + rnd() * 0.5).toFixed(2) });
});
// One under-priced condo on a fixed fee, to show what a heavy winter does to it
SITES.find((s) => s.name === "Westboro Station Condos").fee = 12400;
SITES.forEach((s, i) => (s.id = i));

// ───────────────────────── every visit, every storm ─────────────────────────
const VISITS = [];
for (const e of EVENTS) {
  for (const s of SITES) {
    const salting = e.ice || e.cm >= 2;
    const plow = !e.ice && e.cm >= s.trigger;
    const salts = salting && (s.type === "big" || s.type === "com" || s.type === "hr" || (s.type === "res" && s.salt));
    if (!plow && !salts) continue;
    const pushes = plow ? (e.cm >= 20 && s.type !== "res" ? 2 : 1) : 0;
    const snowX = 1 + e.cm / 25;
    const plowMin = plow ? s.min * snowX * (pushes === 2 ? 0.75 : 1) * pushes : 0;
    const saltMin = salts ? (s.type === "res" ? 3 : 6 + s.min * 0.12) : 0;
    let rev = 0;
    if (s.type === "com" && plow) rev += s.push * (e.cm > 20 ? 2 : e.cm > 10 ? 1.5 : 1) * (pushes === 2 ? 1.6 : 1);
    if (s.type === "hr" && plow) rev += s.rate * plowMin / 60;
    if ((s.type === "com" || s.type === "hr") && salts) rev += s.saltApp;
    VISITS.push({ e: e.i, date: e.date, s: s.id, route: s.route, plow, salts, pushes, min: Math.round(plowMin + saltMin), drive: s.drive * Math.max(1, pushes), rev: Math.round(rev), saltT: salts ? s.saltT * (e.ice ? 1.3 : 1) : 0, cm: e.cm });
  }
}
// Costs: crew hours per route per storm (with loading and overtime), fuel, wear, salt.
const ROUTE_EVENT = {};
for (const v of VISITS) {
  const k = v.route + "|" + v.e;
  const r = (ROUTE_EVENT[k] ||= { route: v.route, e: v.e, min: 0 });
  r.min += v.min + v.drive;
}
for (const r of Object.values(ROUTE_EVENT)) {
  r.hours = r.min / 60 + LOAD_H;
  r.ot = Math.max(0, r.hours - OT_AFTER);
  r.labour = routeRate(r.route) * (r.hours - r.ot + r.ot * OT_X);
}
for (const v of VISITS) {
  const r = ROUTE_EVENT[v.route + "|" + v.e], share = (v.min + v.drive) / r.min, R = ROUTES[v.route];
  v.hours = r.hours * share;
  v.otHours = r.ot * share;
  v.labour = r.labour * share;
  v.otCost = routeRate(v.route) * r.ot * (OT_X - 1) * share;
  v.fuel = v.hours * R.lph * DIESEL;
  v.wear = v.hours * R.wear;
  v.salt = v.saltT * SALT_T;
  v.cost = v.labour + v.fuel + v.wear + v.salt;
}

// Seasonal fees are earned evenly from Nov 1 to Mar 31 (and invoiced half in November, half in January).
const FEE_FROM = "2025-11-01", FEE_TO = "2026-03-31";
const FEE_DAYS = (Date.parse(FEE_TO) - Date.parse(FEE_FROM)) / 86400000 + 1;
const seasonalFee = (s) => (s.type === "res" ? s.fee + (s.salt ? s.saltFee : 0) : s.type === "big" ? s.fee : 0);
function feeShare(from, to) {
  const a = Math.max(Date.parse(from), Date.parse(FEE_FROM)), b = Math.min(Date.parse(to), Date.parse(FEE_TO));
  return b < a ? 0 : ((b - a) / 86400000 + 1) / FEE_DAYS;
}

const FIXED = [
  { n: "Insurance (liability, slip-and-fall, vehicles)", m: 2600 },
  { n: "Yard and salt storage", m: 1500 },
  { n: "Dispatch, GPS and software", m: 180 },
  { n: "Phones and radios", m: 150 },
  { n: "Marketing (fall sign-up push)", m: 300 },
  { n: "Licences, permits, WSIB admin", m: 90 },
  { n: "Accountant", m: 175 },
  { n: "Truck 21 + plow depreciation ($62,000 ÷ 7 yrs)", m: 738, dep: true },
  { n: "Truck 14 + plow + salter depreciation ($78,000 ÷ 7 yrs)", m: 929, dep: true },
  { n: "Truck 9 + plow + salter depreciation ($64,000 ÷ 7 yrs)", m: 762, dep: true },
  { n: "Loader depreciation ($140,000 ÷ 10 yrs)", m: 1167, dep: true },
  { n: "Snow blowers and small equipment", m: 150, dep: true },
];
const FIXED_M = FIXED.reduce((a, f) => a + f.m, 0);
const FIXED_CASH_M = FIXED.filter((f) => !f.dep).reduce((a, f) => a + f.m, 0);
const fixedFor = (from, to) => (FIXED_M * 12 / 365.25) * ((Date.parse(to) - Date.parse(from)) / 86400000 + 1);

// ───────────────────────── sums ─────────────────────────
function sum(from, to, filter = () => true) {
  const vs = VISITS.filter((v) => v.date >= from && v.date <= to && filter(v));
  const s = { n: vs.length, billed: 0, fees: 0, labour: 0, ot: 0, otHours: 0, fuel: 0, wear: 0, salt: 0, saltT: 0, cost: 0, hours: 0, vs };
  for (const v of vs) { s.billed += v.rev; s.labour += v.labour; s.ot += v.otCost; s.otHours += v.otHours; s.fuel += v.fuel; s.wear += v.wear; s.salt += v.salt; s.saltT += v.saltT; s.cost += v.cost; s.hours += v.hours; }
  const share = feeShare(from, to);
  s.fees = SITES.filter((x) => filter({ s: x.id, route: x.route, site: x })).reduce((a, x) => a + seasonalFee(x), 0) * share;
  s.rev = s.billed + s.fees;
  s.cm = s.rev - s.cost;
  s.fixed = fixedFor(from, to);
  s.net = s.cm - s.fixed;
  s.events = new Set(vs.map((v) => v.e)).size;
  s.snow = EVENTS.filter((e) => e.date >= from && e.date <= to).reduce((a, e) => a + e.cm, 0);
  return s;
}
const PERIODS = {
  winter: { label: "Whole winter", sub: "Nov 2025 – Apr 2026", from: W_FROM, to: W_TO, word: "Last winter" },
  dec: { label: "Dec", sub: "December 2025", from: "2025-12-01", to: "2025-12-31", word: "In December" },
  jan: { label: "Jan", sub: "January 2026", from: "2026-01-01", to: "2026-01-31", word: "In January" },
  feb: { label: "Feb", sub: "February 2026", from: "2026-02-01", to: "2026-02-28", word: "In February" },
  mar: { label: "Mar", sub: "March 2026", from: "2026-03-01", to: "2026-03-31", word: "In March" },
};

// Per site, for a period
function siteRows(from, to) {
  const all = sum(from, to);
  const rows = SITES.map((s) => {
    const vs = all.vs.filter((v) => v.s === s.id);
    const r = { s, n: vs.length, pushes: vs.reduce((a, v) => a + v.pushes, 0), salts: vs.filter((v) => v.salts).length, vs,
      billed: vs.reduce((a, v) => a + v.rev, 0), cost: vs.reduce((a, v) => a + v.cost, 0), hours: vs.reduce((a, v) => a + v.hours, 0), saltT: vs.reduce((a, v) => a + v.saltT, 0) };
    r.rev = r.billed + seasonalFee(s) * feeShare(from, to);
    r.cm = r.rev - r.cost;
    r.perHour = r.hours ? r.cm / r.hours : 0;
    r.fixed = all.fixed * r.rev / (all.rev || 1);
    return r;
  }).filter((r) => r.n || r.rev);
  const avg = all.hours ? all.cm / all.hours : 0;
  // Compare like with like: a driveway against other driveways, a lot against other lots.
  const typeAvg = {};
  for (const t of Object.keys(TYPES)) {
    const xs = rows.filter((r) => r.s.type === t);
    const h = xs.reduce((a, r) => a + r.hours, 0);
    typeAvg[t] = h ? xs.reduce((a, r) => a + r.cm, 0) / h : 0;
  }
  for (const r of rows) {
    const avgT = typeAvg[r.s.type];
    r.avgT = avgT;
    r.status = r.cm < 0 ? "bad" : r.perHour < avgT * 0.75 ? "thin" : "good";
    // Seasonal: the snowfall at which the fee stops covering the work
    if (seasonalFee(r.s) && r.cost > 0) r.breakCm = Math.round(seasonalFee(r.s) / (r.cost / TOTAL_CM));
    // Price for next winter that earns the average per equipment-hour in a NORMAL winter
    const normalCost = r.cost * NORMAL_CM / TOTAL_CM, normalHours = r.hours * NORMAL_CM / TOTAL_CM;
    if (seasonalFee(r.s)) r.renew = Math.max(seasonalFee(r.s), round10(normalCost + avgT * normalHours));
  }
  return { rows, avg, all, typeAvg };
}

// ───────────────────────── format, state, routing ─────────────────────────
const $ = (n, d = 0) => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const pn = (n) => (n < -0.5 ? "neg" : n > 0.5 ? "pos" : ""); // red for losing, green for making money
const pct = (n, d = 0) => (n * 100).toFixed(d) + "%";
const h1 = (h) => h.toLocaleString("en-CA", { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + " h";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const kfmt = (n) => (Math.abs(n) >= 1000 ? (n < 0 ? "−$" : "$") + (Math.abs(n) / 1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1) + "k" : $(n));
const store = { get(k, d) { try { const v = localStorage.getItem("ccsnow." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("ccsnow." + k, JSON.stringify(v)); } catch {} } };
const S = { mode: store.get("mode", "simple"), period: store.get("period", "winter"), fix: 100, siteQ: "", siteType: "all", siteSort: "hour", siteAll: false,
  snow: NORMAL_CM, ownerPay: 1000, saltPrice: SALT_T, margin: 20, raise: 6 };

const SIMPLE_TABS = [["home", "Overview"], ["storms", "Storms"], ["sites", "Sites"], ["routes", "Routes"], ["cash", "Cash"]];
const DEEP_TABS = [["pnl", "Profit & loss"], ["contracts", "Contract check"], ["rates", "True hourly cost"], ["salt", "Salt"]];
const ALL = [...SIMPLE_TABS, ...DEEP_TABS, ["sources", "Data sources"]];
function tab() {
  const h = location.hash.slice(1);
  const ok = ALL.some(([k]) => k === h) && (S.mode === "deep" || !DEEP_TABS.some(([k]) => k === h));
  return ok ? h : "home";
}
function renderTabs() {
  const t = tab();
  const a = ([k, l], deep) => `<a href="#${k}" class="${deep ? "deep" : ""}" ${t === k ? 'aria-current="page"' : ""}>${l}</a>`;
  document.getElementById("tabs").innerHTML = `<span class="navh">Every storm</span>` + SIMPLE_TABS.map((x) => a(x)).join("") +
    (S.mode === "deep" ? `<span class="sep" aria-hidden="true"></span><span class="navh">Go deeper</span>` + DEEP_TABS.map((x) => a(x, true)).join("") : "") +
    `<span class="sep" aria-hidden="true"></span><span class="navh">Setup</span>` + a(["sources", "Data sources"]);
  document.getElementById("m-simple").setAttribute("aria-pressed", S.mode === "simple");
  document.getElementById("m-deep").setAttribute("aria-pressed", S.mode === "deep");
}
function render() {
  renderTabs();
  const t = tab(), v = document.getElementById("view");
  v.innerHTML = VIEWS[t]();
  (BIND[t] || (() => {}))(v);
  bindCommon(v);
}
// Keep a dragged slider's section in place and refresh only its [data-live] parts.
function update() {
  const t = tab(), v = document.getElementById("view"), y = scrollY;
  const tmp = document.createElement("div");
  tmp.innerHTML = VIEWS[t]();
  const fresh = [...tmp.children], old = [...v.children];
  fresh.forEach((n, i) => {
    const o = old[i];
    if (o && n.dataset.static && o.dataset.static === n.dataset.static) {
      const lo = o.querySelectorAll("[data-live]"), ln = n.querySelectorAll("[data-live]");
      lo.forEach((el, j) => ln[j] && (el.innerHTML = ln[j].innerHTML));
    } else if (o) o.replaceWith(n);
    else v.append(n);
  });
  old.slice(fresh.length).forEach((o) => o.remove());
  (BIND[t] || (() => {}))(v);
  bindCommon(v);
  scrollTo(0, y);
}
document.getElementById("m-simple").onclick = () => { S.mode = "simple"; store.set("mode", "simple"); if (DEEP_TABS.some(([k]) => k === location.hash.slice(1))) location.hash = "home"; render(); };
document.getElementById("m-deep").onclick = () => { S.mode = "deep"; store.set("mode", "deep"); render(); };
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

function periodBar() {
  return `<div class="row between"><div class="seg" role="group" aria-label="Period">${Object.entries(PERIODS)
    .map(([k, p]) => `<button data-period="${k}" aria-pressed="${S.period === k}">${p.label}</button>`).join("")}</div>
    <span class="muted small">${PERIODS[S.period].sub}</span></div>`;
}
const COPY = {};
function bindCommon(v) {
  v.querySelectorAll("[data-period]").forEach((b) => (b.onclick = () => { S.period = b.dataset.period; store.set("period", S.period); render(); }));
  v.querySelectorAll("[data-site]").forEach((r) => {
    r.onclick = () => openSite(+r.dataset.site);
    r.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), openSite(+r.dataset.site));
  });
  v.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(COPY[b.dataset.copy](), b)));
  v.querySelectorAll("[data-range]").forEach((r) => (r.oninput = () => { S[r.dataset.range] = +r.value; update(); }));
}
function copyText(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1500); };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); done(); } catch {} ta.remove(); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
}
const csv = (rows) => rows.map((r) => r.map((x) => (typeof x === "string" && /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x)).join(",")).join("\n");

// ───────────────────────── charts ─────────────────────────
const chartW = (half) => {
  const full = Math.max(300, (document.getElementById("view").clientWidth || 640) - 34 - 32);
  return Math.round(half && innerWidth > 760 ? (full - 16) / 2 : full);
};
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function bars(vals, labels, { hi = -1, color = "var(--c-labour)", colors = null, h = 200, fmt = (n) => $(n), half = false, top2 = null } = {}) {
  const W = chartW(half), H = h, L = 50, B = 22, T = 10;
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const step = niceStep((max - min) / 4);
  const top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step || 0;
  const y = (v) => T + (top - v) / (top - bot || 1) * (H - T - B);
  const bw = (W - L) / vals.length;
  let g = "";
  for (let t = bot; t <= top + 1e-9; t += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  const every = Math.ceil(labels.length / Math.max(3, Math.floor(W / 70)));
  vals.forEach((v, i) => {
    const x = L + i * bw + bw * 0.15, yy = Math.min(y(v), y(0)), hh = Math.abs(y(v) - y(0));
    const c = v < 0 ? "var(--neg)" : colors ? colors[i] : color;
    g += `<rect x="${x}" y="${yy}" width="${bw * 0.7}" height="${Math.max(hh, 1)}" rx="2" fill="${c}" opacity="${hi < 0 || i === hi ? 1 : 0.6}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if (top2) g += `<text x="${x + bw * 0.35}" y="${yy - 4}" text-anchor="middle">${esc(top2[i])}</text>`;
    if (i % every === 0) g += `<text x="${x + bw * 0.35}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  g += `<line class="zero" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lines(series, xs, { h = 220, fmt = (n) => $(n), xfmt = (x) => x, ref = null, refLabel = "", marks = [], half = false, vline = null } = {}) {
  const W = chartW(half), H = h, L = 56, B = 22, T = 12;
  const all = series.flatMap((s) => s.vals).concat(ref ?? []);
  const max = Math.max(...all), min = Math.min(0, ...all);
  const step = niceStep((max - min) / 4);
  const top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
  const y = (v) => T + (top - v) / (top - bot || 1) * (H - T - B);
  const x = (i) => L + (i / (xs.length - 1)) * (W - L - 8);
  let g = "";
  for (let t = bot; t <= top + 1e-9; t += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  const every = Math.ceil(xs.length / Math.max(3, Math.floor(W / 80)));
  xs.forEach((l, i) => { if ((i % every === 0 && xs.length - 1 - i >= every / 2) || i === xs.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(xfmt(l))}</text>`; });
  if (bot < 0) g += `<line class="zero" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  if (ref != null) g += `<line x1="${L}" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W}" y="${y(ref) - 6}" text-anchor="end" style="fill:var(--neg);font-weight:600">${esc(refLabel)}</text>`;
  if (vline) g += `<line x1="${x(vline.i)}" x2="${x(vline.i)}" y1="${T}" y2="${H - B}" stroke="var(--c-snow)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${x(vline.i) + 4}" y="${T + 10}" style="fill:var(--c-snow);font-weight:600">${esc(vline.label)}</text>`;
  for (const s of series) {
    const pts = s.vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
    if (s.area) g += `<polygon points="${x(0)},${y(Math.max(bot, 0))} ${pts} ${x(s.vals.length - 1)},${y(Math.max(bot, 0))}" fill="${s.color}" opacity="0.12"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
  }
  for (const m of marks) g += `<circle cx="${x(m.i)}" cy="${y(m.v)}" r="5" fill="var(--surface)" stroke="${m.color}" stroke-width="2.5"/><text x="${x(m.i)}" y="${y(m.v) - 10}" text-anchor="${x(m.i) > W - 80 ? "end" : x(m.i) < L + 80 ? "start" : "middle"}" style="fill:var(--ink);font-weight:600">${esc(m.label)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

// SYS: the systems Cutting Cost reads from. SOURCES: what each headline number is made of.
// (Both defined above for this company.)
const SYS_CLS = { crm: "s-crm", gps: "s-gps", you: "s-you", pub: "s-pub", calc: "s-calc" };
function src(key) {
  const s = SOURCES[key];
  if (!s) return "";
  return `<button class="src" data-src="${key}" title="Where this comes from" aria-label="Where ${esc(s.title.toLowerCase())} comes from">${s.from.map((k) => `<span class="srct ${SYS_CLS[SYS[k].kind]}">${SYS[k].short}</span>`).join("")}</button>`;
}
function syncStrip() {
  return `<div class="sources" aria-label="Data sources"><span>Numbers from</span>${Object.entries(SYS).filter(([, x]) => x.kind !== "calc").map(([k, x]) => `<span class="sys ${x.warn ? "warn" : ""}" title="${esc(x.what)}"><i aria-hidden="true"></i><b>${x.short}</b><small>${x.status}</small></span>`).join("")}<a href="#sources" class="small">How it fits together ›</a><a href="#sources" class="syssum"><i aria-hidden="true"></i>${Object.values(SYS).filter((x) => x.kind !== "calc").length} sources, all up to date ›</a></div>`;
}
function openSource(key) {
  const s = SOURCES[key], d = document.getElementById("drawer");
  d.innerHTML = `<div class="drawer-back" id="db"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="sh">
    <div class="row between"><h2 id="sh">${esc(s.title)}</h2><button class="btn" id="dx">Close</button></div>
    <p class="formula">${s.how}</p>
    <section class="card"><h3>Comes from</h3>

    </section>
    ${s.note ? `<p class="explain">${s.note}</p>` : ""}
  </aside></div>`;
  const close = () => (d.innerHTML = "");
  document.getElementById("dx").onclick = close;
  document.getElementById("db").onclick = (e) => e.target.id === "db" && close();
  document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", k); } });
  document.getElementById("dx").focus();
}
document.addEventListener("click", (e) => { const b = e.target.closest?.("[data-src]"); if (b) { e.preventDefault(); e.stopPropagation(); openSource(b.dataset.src); } }, true);

// ───────────────────────── visual guides ─────────────────────────
// Verdict: Healthy / Thin / Losing, with a meter of what's kept per $100 against a goal.
function verdict(per100, goal = 15) {
  const st = per100 >= goal ? "good" : per100 >= 5 ? "thin" : "bad";
  const word = { good: "✓ Healthy", thin: "! Thin", bad: "✕ Losing money" }[st];
  const max = 40, pos = Math.max(0, Math.min(max, per100)) / max * 100;
  const col = { good: "var(--pos)", thin: "var(--warn)", bad: "var(--neg)" }[st];
  return `<div class="verdict"><span class="word ${st}">${word}</span>
    <div class="meter" role="img" aria-label="Kept ${$(per100)} of every $100, goal ${$(goal)}"><span style="width:${pos}%;background:${col}"></span><b style="left:${goal / max * 100}%" title="Goal"></b></div>
    <div class="meterlbl"><span>$0</span><span>goal ${$(goal)}</span><span>$${max}+ kept per $100</span></div></div>`;
}
// Money flow: money in, then each cost taken off, then what's left.
function flow(rev, costs, keptLabel = "Kept") {
  const max = Math.max(rev, 1);
  let at = rev;
  const rows = [`<div class="fr in"><span>Money in</span><div class="track"><span style="left:0;width:${rev / max * 100}%;background:var(--c-snow, var(--c-labour));opacity:.35"></span></div><span class="fv">${kfmt(rev)}</span></div>`];
  for (const [label, v, color] of costs) {
    at -= v;
    rows.push(`<div class="fr"><span>${label}</span><div class="track"><span style="left:${Math.max(0, at) / max * 100}%;width:${v / max * 100}%;background:${color}"></span></div><span class="fv">−${kfmt(v)}</span></div>`);
  }
  rows.push(`<div class="fr kept"><span><b>${at >= 0 ? keptLabel : "Lost"}</b></span><div class="track"><span style="left:0;width:${Math.abs(at) / max * 100}%;background:${at >= 0 ? "var(--c-kept)" : "var(--neg)"}"></span></div><span class="fv ${pn(at)}">${kfmt(at)}</span></div>`);
  return `<div class="flow" role="img" aria-label="Money in ${kfmt(rev)}, ${costs.map((c) => `${c[0]} ${kfmt(c[1])}`).join(", ")}, ${keptLabel.toLowerCase()} ${kfmt(at)}">${rows.join("")}</div>`;
}
// A small bar in a table cell: value against the best in the list, with the average marked.
function mbar(v, max, avg, status) {
  const col = { good: "var(--pos)", thin: "var(--warn)", bad: "var(--neg)" }[status];
  const w = Math.max(0, Math.min(100, (v / (max || 1)) * 100));
  return `<div class="mbar"><div class="t"><span style="width:${w}%;background:${col}"></span>${avg > 0 ? `<b style="left:${Math.min(100, avg / (max || 1) * 100)}%" title="Average"></b>` : ""}</div><span class="v ${({ good: "pos", thin: "warnc", bad: "neg" })[status]}">${$(v)}</span></div>`;
}
const ICON = { bad: "✕", warn: "!", good: "✓" };

// Cash for the coming winter (Nov 9, 2026 → Oct 2027)
function cashPlan(ownerPay = S.ownerPay) {
  const weeks = 52, start = Date.UTC(2026, 10, 9);
  const W = sum(W_FROM, W_TO);
  const k = NORMAL_CM / TOTAL_CM; // a normal winter next year
  const fees = SITES.reduce((a, s) => a + seasonalFee(s), 0);
  const billedPerWeekWinter = W.billed * k / 20, costPerWeekWinter = (W.cost - W.salt) * k / 20;
  const saltPrebuy = Math.round(W.saltT * k * 0.7) * S.saltPrice; // 70% bought before the first storm
  const saltTopUp = Math.round(W.saltT * k * 0.3) * S.saltPrice;
  const vals = [], labels = [];
  let bal = 31800;
  for (let i = 0; i <= weeks; i++) {
    const d = new Date(start + i * 7 * 86400000), m = d.getUTCMonth();
    labels.push(d.toISOString().slice(0, 10));
    if (i > 0) {
      const winter = m >= 10 || m <= 2 || (m === 3 && d.getUTCDate() < 15);
      if (i === 1) bal -= saltPrebuy;
      if (i === 12) bal -= saltTopUp;
      if (i === 2) bal += fees * 0.5;      // first half of seasonal fees, mid-November
      if (i === 10) bal += fees * 0.45;    // second half in January (5% never collected on time)
      if (winter) { bal -= costPerWeekWinter; }
      // per-push and hourly invoices are paid about 6 weeks after the work
      const workDate = new Date(start + (i - 6) * 7 * 86400000), wm = workDate.getUTCMonth();
      if (i >= 6 && (wm >= 10 || wm <= 2 || (wm === 3 && workDate.getUTCDate() < 15))) bal += billedPerWeekWinter;
      bal -= FIXED_CASH_M * 12 / 52 + ownerPay;
      if (m === 8 && d.getUTCDate() <= 7) bal -= 9000; // September: equipment service and plow repairs
    }
    vals.push(bal);
  }
  return { vals, labels, saltPrebuy, fees };
}

    ${deep ? `<details><summary>How this is worked out</summary><p class="explain">Starts with $31,800 today. Salt: 70% of a normal winter's tonnes bought now, 30% in January. Seasonal fees: 50% mid-November, 45% in January. Per-push, hourly and salting invoices: paid about six weeks after each storm. Winter crew pay, fuel and wear: spread over 20 storm weeks at last winter's cost per cm, scaled to ${NORMAL_CM} cm. Bills (without depreciation, which isn't cash) every week of the year, plus $9,000 of equipment service in September.</p></details>` : ""}
  </section>

    ${R("<b>Contribution</b> (profit from the work)", (s) => s.cm, "total")}
    ${R("Contribution margin", (s) => (s.rev ? pct(s.cm / s.rev) : "–"), "sub")}
    ${R("Fixed bills incl. depreciation", (s) => -s.fixed, "sub")}
    ${R("<b>Net profit</b>", (s) => s.net, "total")}
  </tbody></table></div>
  <p class="explain">A snow company earns its whole year in five months. The Year column is what's left after paying the summer's bills too: insurance, the yard and the equipment don't stop in April.</p></section>`;
};

VIEWS.contracts = () => {
  // Profit by contract type as snowfall changes, from last winter's cost and billing per cm.
  const W = sum(W_FROM, W_TO);
  const types = Object.keys(TYPES).map((t) => {
    const s = sum(W_FROM, W_TO, (v) => (v.site ? v.site.type : SITES[v.s].type) === t);
    const fees = s.fees, billedPerCm = s.billed / TOTAL_CM, costPerCm = s.cost / TOTAL_CM;
    return { t, fees, billedPerCm, costPerCm, at: (cm) => fees + billedPerCm * cm - costPerCm * cm };
  });
  const xs = Array.from({ length: 15 }, (_, i) => 60 + i * 20);
  const colors = { res: "var(--c-labour)", com: "var(--c-fuel)", big: "var(--c-maint)", hr: "var(--c-mat)" };
  const cm = S.snow;
  const tot = types.reduce((a, x) => a + x.at(cm), 0) - FIXED_M * 12;
  const xi = xs.findIndex((x) => x >= cm);
  return `<section class="card" data-static="snow"><h2>What if next winter is light or heavy?</h2>
    <p class="explain">Seasonal contracts pay the same whatever falls; per-push and hourly work pays more when it snows more. Slide the snowfall to see how each kind of contract and the whole year would do, at last winter's prices and costs.</p>
    <div class="range" style="max-width:520px"><div class="row"><label for="snow">Snow next winter</label><span class="num cm" data-live>${cm} cm</span></div><input type="range" id="snow" data-range="snow" min="60" max="340" step="10" value="${cm}"></div>
    <div class="ticks" style="max-width:520px"><span>Light (60)</span><span>Normal (${NORMAL_CM})</span><span>Last winter (${TOTAL_CM})</span><span>Heavy (340)</span></div></section>
  <section class="hero">
    <div class="tile big"><span class="k">True profit for the year</span><span class="v ${pn(tot)}">${$(tot)}</span><span class="small muted">at ${cm} cm, after ${$(FIXED_M * 12)} of bills</span></div>
    ${types.slice(0, 3).map((x) => `<div class="tile"><span class="k">${TYPES[x.t].short}</span><span class="v ${pn(x.at(cm))}">${$(x.at(cm))}</span><span class="small muted">profit from the work</span></div>`).join("")}
  </section>
  <section class="card"><h2>Profit from the work, by contract type</h2>
    ${lines(types.map((x) => ({ color: colors[x.t], vals: xs.map((c) => x.at(c)) })), xs, { fmt: kfmt, xfmt: (x) => x + " cm", vline: { i: Math.max(0, xi), label: cm + " cm" } })}
    ${legendRow(types.map((x) => [TYPES[x.t].short, colors[x.t]]))}
    <div class="steps">${types.map((x) => `<div><span>${TYPES[x.t].n}</span><span>${x.fees ? `${$(x.fees)} fees, ` : ""}${x.billedPerCm ? `${$(x.billedPerCm)} billed per cm, ` : ""}${$(x.costPerCm)} cost per cm${x.fees && x.costPerCm > x.billedPerCm ? ` · breaks even at <span class="cm">${Math.round(x.fees / (x.costPerCm - x.billedPerCm))} cm</span>` : ""}</span></div>`).join("")}</div>
    <p class="explain">The mix is your weather insurance. Seasonal driveways and lots carry you through a light winter; per-push and hourly work carry you through a heavy one. If seasonal contracts break even below a normal winter, they need a higher fee or a snowfall clause.</p></section>`;
};

VIEWS.rates = () => {
  const W = sum(W_FROM, W_TO);
  const yearFixed = FIXED_M * 12;
  const totalHours = W.hours * NORMAL_CM / TOTAL_CM;
  const ohPerHour = yearFixed / totalHours;
  const out = ROUTES.map((R) => {
    const s = sum(W_FROM, W_TO, (v) => v.route === R.id);
    const pay = routeRate(R.id), otShare = s.ot / Math.max(1, s.hours);
    const fuel = R.lph * DIESEL, wear = R.wear;
    const cost = pay + otShare + fuel + wear + ohPerHour;
    const need = cost / (1 - S.margin / 100);
    return { R, s, pay, otShare, fuel, wear, cost, need, actual: s.rev / Math.max(1, s.hours) };
  });
  return `<section class="card" data-static="mg"><h2>What an hour of plowing really costs</h2>
    <p class="explain">Wages are only part of it. An hour of a truck or loader on a lot also burns diesel, wears cutting edges and hydraulics, carries overtime from long storms, and has to pay a year of insurance and equipment in a few hundred hours of snow.</p>
    <div class="range" style="max-width:420px"><div class="row"><label for="mg">Profit you want to keep</label><span class="num" data-live>${S.margin}%</span></div><input type="range" id="mg" data-range="margin" min="0" max="40" step="1" value="${S.margin}"></div></section>
  <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">${out.map((o) => `<section class="card"><h3>${o.R.name}</h3><p class="muted small">${o.R.unit}</p>
    <div class="steps">
      <div><span>Crew (${o.R.people.map((p) => `${p[0]} $${p[1]}`).join(", ")}) + ${pct(BURDEN)} payroll costs</span><span>${$(o.pay, 2)}</span></div>
      <div><span>Overtime, averaged per hour</span><span>${$(o.otShare, 2)}</span></div>
      <div><span>Diesel, ${o.R.lph} L/h at $${DIESEL}</span><span>${$(o.fuel, 2)}</span></div>
      <div><span>Wear and repairs</span><span>${$(o.wear, 2)}</span></div>
      <div><span>Fixed bills per working hour (${$(yearFixed)} ÷ ${Math.round(totalHours)} h in a normal winter)</span><span>${$(ohPerHour, 2)}</span></div>
      <div><span><b>Cost of one hour</b></span><span><b>${$(o.cost, 2)}</b></span></div>
      <div class="res"><span>Charge at least, per hour</span><span>${$(o.need, 2)}</span></div>
    </div>
    <p class="small">Last winter this route earned <b class="${o.actual < o.need ? "neg" : "pos"}">${$(o.actual, 2)}</b> an hour${o.actual < o.need ? `, under target` : ", above target"}.</p></section>`).join("")}</div>
  <section class="card"><h3>Quick quote for a new lot</h3>
    <div class="row"><label class="f">Minutes to plow at 10 cm<input type="number" id="qm" min="5" step="5" value="45"></label><label class="f">Minutes to drive there<input type="number" id="qd" min="0" step="1" value="10"></label><label class="f">Route<select id="qr">${ROUTES.map((r, i) => `<option value="${i}" ${i === 1 ? "selected" : ""}>${r.short}</option>`).join("")}</select></label></div>
    <p class="lead" id="qout"></p></section>`;
};
BIND.rates = (v) => {
  const q = () => {
    const W = sum(W_FROM, W_TO), i = +v.querySelector("#qr").value, R = ROUTES[i];
    const s = sum(W_FROM, W_TO, (x) => x.route === i);
    const perHour = routeRate(i) + s.ot / Math.max(1, s.hours) + R.lph * DIESEL + R.wear + FIXED_M * 12 / (W.hours * NORMAL_CM / TOTAL_CM);
    const m = +v.querySelector("#qm").value || 0, d = +v.querySelector("#qd").value || 0;
    const cost = perHour * (m + d) / 60;
    const push = Math.ceil(cost / (1 - S.margin / 100) / 5) * 5;
    const pushes = Math.round(TOTAL_CM ? EVENTS.filter((e) => !e.ice && e.cm >= 2.5).length * NORMAL_CM / TOTAL_CM : 0);
    v.querySelector("#qout").innerHTML = `Quote <b>${$(push)}</b> a push up to 10 cm, or <b>${$(round10(push * pushes * 1.15))}</b> for the winter on a seasonal contract (about ${pushes} pushes in a normal winter, plus 15% for heavier storms). Salt is extra.`;
  };
  v.querySelectorAll("#qm,#qd,#qr").forEach((x) => (x.oninput = q));
  q();
};

VIEWS.salt = () => {
  const { rows } = siteRows(W_FROM, W_TO);
  const salted = rows.filter((r) => r.saltT > 0).sort((a, b) => b.saltT - a.saltT);
  const W = sum(W_FROM, W_TO);
  const unbilled = salted.filter((r) => r.s.type === "big" || r.s.type === "res");
  const unbilledT = unbilled.reduce((a, r) => a + r.saltT, 0);
  const billedSalt = salted.filter((r) => r.s.type === "com" || r.s.type === "hr").reduce((a, r) => a + r.salts * r.s.saltApp, 0);
  const billedT = salted.filter((r) => r.s.type === "com" || r.s.type === "hr").reduce((a, r) => a + r.saltT, 0);
  return `<div class="grid3">
    <div class="tile"><span class="k">Salt spread</span><span class="v">${W.saltT.toFixed(0)} t</span><span class="small muted">${$(W.salt)} at ${$(SALT_T)}/tonne</span></div>
    <div class="tile"><span class="k">Billed per application</span><span class="v">${$(billedSalt)}</span><span class="small muted">${billedT.toFixed(0)} t on per-push and hourly sites · ${$(billedSalt / Math.max(1, billedT))}/t charged</span></div>
    <div class="tile"><span class="k">Included in a fee</span><span class="v">${unbilledT.toFixed(0)} t</span><span class="small muted">${$(unbilledT * SALT_T)} paid out of seasonal fees</span></div>
  </div>
  <section class="card"><div class="row between"><h2>Salt by site</h2>${src("salt")}</div>
    <div class="tablewrap"><table><thead><tr><th>Site</th><th>Contract</th><th class="n">Applications</th><th class="n">Tonnes</th><th class="n">Salt cost</th><th class="n">Charged</th></tr></thead><tbody>
    ${salted.slice(0, 30).map((r) => `<tr class="click" tabindex="0" data-site="${r.s.id}"><td><div class="who">${esc(r.s.name)}</div></td><td><span class="typechip">${TYPES[r.s.type].short}</span></td><td class="n">${r.salts}</td><td class="n">${r.saltT.toFixed(1)}</td><td class="n">${$(r.saltT * SALT_T)}</td><td class="n">${r.s.saltApp ? $(r.salts * r.s.saltApp) : `<span class="muted">in the fee</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="explain">Salt-included contracts are the risk: an icy winter can double the tonnes without changing the fee. Write a tonnage cap into next winter's contracts, or price salt per application. Tonnes come from the salter controller or the loads logged at the yard.</p></section>`;
};

VIEWS.sources = () => `
  <section class="card"><h2>Where the numbers come from</h2>
    <p class="explain">Every number in Cutting Cost is built from these. Tap the small tags next to a number anywhere in the app to see exactly which ones it uses and how.</p>
    ${Object.entries(SYS).filter(([, x]) => x.kind !== "calc").map(([k, x]) => `<div class="srcrow"><span class="srct ${SYS_CLS[x.kind]}">${x.short}</span><div><b>${esc(x.name)}</b> <span class="chip good">${esc(x.status)}</span><p class="small">${esc(x.what)}</p></div></div>`).join("")}
  </section>
  <section class="card"><div class="row between"><div><h2>Where the numbers come from</h2><p class="muted small">Sample setup</p></div><span class="chip good">Connected</span></div>
    <div class="grid3">
      <div class="tile"><span class="k">From your CRM</span><span class="v">${SITES.length}</span><span class="small muted">sites and contracts</span></div>
      <div class="tile"><span class="k">From the trucks</span><span class="v">${VISITS.length.toLocaleString()}</span><span class="small muted">site visits from GPS arrival and departure</span></div>
      <div class="tile"><span class="k">Storm log</span><span class="v">${EVENTS.length}</span><span class="small muted">events with snowfall</span></div>
    </div></section>
  <section class="card"><h2>What each side does</h2>
    <div class="cmp">
      <div><b>Your CRM or dispatch software keeps</b><ul><li>Customers, sites and contracts</li><li>Routes and dispatch</li><li>Invoices and payments</li><li>Proof of service photos</li></ul></div>
      <div><b>Cutting Cost adds</b><ul>
        <li>The real cost of every storm and every site: crew time, overtime, diesel, wear and salt</li>
        <li>Which seasonal contracts lose money in a heavy winter, and the snowfall where each breaks even</li>
        <li>True profit after insurance, the yard and the equipment, all year round</li>
        <li>Cash for the salt pre-buy and the summer</li>
        <li>True hourly cost and quotes for new lots</li></ul></div>
    </div>
    <p class="explain">The operator's side stays tiny: sign in on the truck tablet, keep location on, type the odometer or engine hours at the start and end of a call-out. Arrivals and departures at each site record themselves.</p></section>
  <section class="card"><h2>What it uses from you, once</h2>
    <div class="tablewrap"><table><thead><tr><th>Setting</th><th>Sample value</th><th>Used for</th></tr></thead><tbody>
      ${ROUTES.map((r) => `<tr><td>${r.name}</td><td>${r.people.map((p) => `${p[0]} $${p[1]}/h`).join(", ")} + ${pct(BURDEN)} payroll costs · ${r.lph} L/h · wear $${r.wear}/h</td><td>Cost of each hour</td></tr>`).join("")}
      <tr><td>Overtime</td><td>After ${OT_AFTER} h in a call-out, ×${OT_X}</td><td>Long storms</td></tr>
      <tr><td>Salt</td><td>${$(SALT_T)} a tonne</td><td>Salt cost per site</td></tr>
      <tr><td>Diesel</td><td>$${DIESEL}/L (or the area average, looked up daily)</td><td>Fuel</td></tr>
      <tr><td>Fixed bills</td><td>${FIXED.length} lines, ${$(FIXED_M)} a month, all year</td><td>True profit, cash</td></tr>
      <tr><td>Normal winter</td><td>${NORMAL_CM} cm (Environment Canada average for your area)</td><td>Contract check, next winter's prices</td></tr>
    </tbody></table></div></section>`;

render();
</script>
</body></html>
