# Netlify site for the office app (owner and dispatcher).
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Netlify: Site configuration > Environment variables.
[build]
  command = "npm run build -w @zentek/office"
  publish = "apps/office/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
